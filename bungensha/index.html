<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="分限者への道"><meta name="theme-color" content="#1f3d66"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"></head><body>
<title>分限者への道</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=Yuji+Syuku&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 帳場: an indigo noren hangs over a grey washi counting-desk; each trade is a ledger card; a fixed ink rail sends the season on. */
:root{
  --paper:#e5e8e1;
  --sheet:#f4f5f1;
  --sheet-2:#eaede6;
  --ink:#1b2127;
  --ink-2:#4a535b;
  --ink-3:#6f7880;
  --rule:#c4c9c0;
  --ai:#1f3d66;
  --ai-2:#2c5689;
  --on-ai:#eef1ec;
  --shu:#b3342a;
  --on-shu:#fff8f3;
  --kin:#845d0a;
  --good:#2d6a41;
  --bad:#b3342a;
  --bar-bg:#1b2127;
  --bar-fg:#e5e8e1;
  --veil:rgba(18,24,30,.55);
  --display:"Yuji Syuku","Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11151a; --sheet:#192027; --sheet-2:#1f272f; --ink:#e6e2d5; --ink-2:#b3b1a6; --ink-3:#8a8f91; --rule:#313941;
    --ai:#1a3253; --ai-2:#8eb0d8; --on-ai:#eef1ec; --shu:#e2644f; --on-shu:#1b0f0b; --kin:#e2b24c; --good:#7cc190; --bad:#f07c67;
    --bar-bg:#0a0d10; --bar-fg:#e6e2d5; --veil:rgba(0,0,0,.62); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11151a; --sheet:#192027; --sheet-2:#1f272f; --ink:#e6e2d5; --ink-2:#b3b1a6; --ink-3:#8a8f91; --rule:#313941;
  --ai:#1a3253; --ai-2:#8eb0d8; --on-ai:#eef1ec; --shu:#e2644f; --on-shu:#1b0f0b; --kin:#e2b24c; --good:#7cc190; --bad:#f07c67;
  --bar-bg:#0a0d10; --bar-fg:#e6e2d5; --veil:rgba(0,0,0,.62); color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body.has-bar{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{text-wrap:balance}
button,input{font-family:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--ink-3)}
.kin{color:var(--kin)}
.good{color:var(--good)}
.bad{color:var(--bad)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--shu);outline-offset:2px}
@media (prefers-reduced-motion: no-preference){
  .dlg{animation:rise .22s ease-out}
  @keyframes rise{from{transform:translateY(8px)}to{transform:none}}
}

/* 暖簾 */
.noren{background:var(--ai);color:var(--on-ai);position:relative;padding-block:16px 36px}
.noren::after{content:"";position:absolute;left:0;right:0;bottom:0;height:18px;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 5px),var(--paper) calc(25% - 5px) 25%)}
.noren-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mon{width:58px;height:58px;flex:none;color:var(--on-ai)}
.mon svg{width:100%;height:100%;display:block}
.mons{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;max-width:780px}
.monb{appearance:none;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);padding:8px 4px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;font:500 11.5px var(--ui);border-radius:2px;line-height:1.3;text-align:center}
.monb:hover{border-color:var(--ink-2)}
.monb .mi{width:44px;height:44px;display:block}
.monb .mn small{display:block;font-size:10px;opacity:.75;font-weight:400}
.monb .mi svg{width:100%;height:100%;display:block}
.monb[aria-pressed="true"]{border:2px solid var(--ai-2);background:var(--sheet-2);padding:7px 3px 5px;color:var(--ai-2)}
.sl-mon{display:inline-block;width:24px;height:24px;vertical-align:-3px;margin-right:7px;color:var(--ink)}
.sl-mon svg{width:100%;height:100%;display:block}
.who{flex:1 1 220px;min-width:0}
.who .nm{font-family:var(--display);font-size:clamp(23px,4vw,31px);line-height:1.2}
.who .nm small{font-size:.6em;opacity:.85;margin-right:.3em}
.who .sub{font-size:12.5px;opacity:.86;letter-spacing:.06em}
.when-h{margin-left:auto;text-align:right;font-family:var(--display);font-size:clamp(21px,3.4vw,29px);line-height:1.2}
.when-h small{display:block;font-family:var(--ui);font-size:12px;opacity:.82;letter-spacing:.08em}

/* 帳場の数字 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:14px}
.stat{background:var(--sheet);padding:9px 12px 10px;min-width:0}
.stat .k{font-size:11.5px;color:var(--ink-2);letter-spacing:.12em}
.stat .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.35;overflow-wrap:anywhere}
.stat .v small{font-size:12px;font-weight:500;color:var(--ink-2)}
.meter{display:inline-block;width:64px;height:7px;background:var(--sheet-2);border:1px solid var(--rule);vertical-align:middle;margin-right:6px;position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--ai-2)}

/* 見出し */
.tabs{display:flex;gap:4px;margin-top:18px;border-bottom:2px solid var(--ink);overflow-x:auto;scrollbar-width:none}
.tab{appearance:none;border:1px solid var(--rule);border-bottom:none;background:var(--sheet-2);color:var(--ink-2);font:500 14px var(--ui);padding:8px 15px 7px;border-radius:5px 5px 0 0;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ai);border-color:var(--ai);color:var(--on-ai)}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--shu);margin-left:6px;vertical-align:middle}
.hint{margin:14px 0 0;font-size:13.5px;color:var(--ink-2);font-family:var(--body)}
.hint b{font-family:var(--display);font-weight:400;font-size:16px;color:var(--ink);margin-right:6px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;margin-top:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--rule);background:var(--sheet);color:var(--ink-2);font:500 13px var(--ui);padding:4px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ai);border-color:var(--ai);color:var(--on-ai)}
.chip small{opacity:.75;margin-left:3px}
.opts{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.opts label{display:inline-flex;align-items:center;gap:6px}

/* 帳面 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px;margin-top:14px;align-items:start}
.card{background:var(--sheet);border:1px solid var(--rule);padding:14px 16px 16px;display:flex;flex-direction:column;gap:9px;min-width:0}
.card-h{display:flex;align-items:center;gap:12px}
.seal{width:44px;height:44px;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:26px;line-height:1;flex:none}
.card.off .seal{border-style:dashed;color:var(--ink-3);border-color:var(--ink-3)}
.card-h h3{margin:0;font-family:var(--body);font-weight:800;font-size:18px;line-height:1.3}
.lv{font-size:12px;color:var(--ink-2);letter-spacing:.06em}
.pips{display:inline-flex;gap:2px;vertical-align:-1px;margin-left:4px}
.pip{width:8px;height:8px;border:1px solid var(--ink-2)}
.pip.on{background:var(--ink);border-color:var(--ink)}
.pills{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;align-self:flex-start}
.pill{font-size:11.5px;padding:1px 9px;border:1px solid currentColor;border-radius:999px;white-space:nowrap}
.pill.go{color:var(--shu);font-weight:700}
.pill.wait{color:var(--ink-3)}
.pill.ban{color:var(--ai-2);font-weight:700}
.desc{font-family:var(--body);font-size:14px;color:var(--ink-2);margin:0}
.note{font-size:12.5px;color:var(--ink-3);margin:0}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1px 14px;font-size:13.5px;margin:0}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sub-h{font-size:12px;letter-spacing:.1em;color:var(--ink-2);border-top:1px dashed var(--rule);padding-top:8px;margin-top:2px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.qty{display:inline-flex;align-items:center;border:1px solid var(--ink-2);background:var(--paper)}
.qty input{width:86px;border:0;background:transparent;color:var(--ink);font:500 15px var(--ui);padding:6px 6px 6px 8px;text-align:right;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qty .u{padding-right:8px;font-size:13px;color:var(--ink-2)}
.qty .mx{border:0;border-left:1px solid var(--rule);background:transparent;color:var(--ai-2);font:500 12px var(--ui);padding:8px 9px;cursor:pointer;align-self:stretch}
.btn{appearance:none;border:1px solid var(--ink-2);background:var(--sheet);color:var(--ink);font:500 14px var(--ui);padding:6px 13px;cursor:pointer;border-radius:2px;line-height:1.5}
.btn:hover:not(:disabled){background:var(--sheet-2);border-color:var(--ink)}
.btn.pri,.btn.on{background:var(--ai);border-color:var(--ai-2);color:var(--on-ai)}
.btn.pri:hover:not(:disabled),.btn.on:hover:not(:disabled){background:var(--ai-2);color:var(--sheet)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{font-size:12.5px;padding:3px 9px}
.prev{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;line-height:1.6}
.prev:empty{display:none}
.prev b{color:var(--ink)}
.mgr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);border-top:1px dashed var(--rule);padding-top:8px}
.upg{margin-top:2px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--rule);padding-top:10px;font-size:13px}
.upg small{display:block;color:var(--ink-3);font-size:11.5px}
.upg .btn{flex:none;white-space:nowrap}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.list li{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13.5px;border-bottom:1px dotted var(--rule);padding-bottom:7px}
.list li:last-child{border-bottom:0;padding-bottom:0}
.est{border-top:1px dashed var(--rule);padding-top:10px;display:flex;flex-direction:column;gap:7px}
.est-h{display:flex;gap:10px;align-items:center}
.est-h b{font-family:var(--body);font-weight:800;font-size:16px}
.seal.sm{width:32px;height:32px;font-size:18px;border-width:1.5px}
.list.tk li{align-items:flex-start;font-size:13px}
.list.tk li>span:first-child{flex:1 1 14em;min-width:0}
.tk-d{display:block;font-size:11.5px}
details.tkd summary{cursor:pointer;font-size:13px;color:var(--ai-2);margin-top:2px}
.offer{border:1px solid var(--rule);background:var(--paper);padding:10px 12px;display:flex;flex-direction:column;gap:7px;font-size:13.5px}
.offer .who2{font-family:var(--body);font-weight:800;font-size:15px}
.bar-meter{height:8px;background:var(--sheet-2);border:1px solid var(--rule);position:relative}
.bar-meter i{position:absolute;left:0;top:0;bottom:0;background:var(--good)}
.empty{grid-column:1/-1;background:var(--sheet);border:1px dashed var(--rule);padding:18px;font-family:var(--body);color:var(--ink-2)}

/* 家族 */
.sel{border:1px solid var(--ink-2);background:var(--paper);color:var(--ink);font:500 13px var(--ui);padding:5px 6px;max-width:100%;min-width:0}
.assign{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-size:12.5px;max-width:100%;min-width:0;white-space:nowrap}
.assign .sel{flex:1 1 auto;min-width:0;width:100%;white-space:normal}
.prow .pb{width:6.5em;text-align:right}
.mgr .assign{flex:1 1 100%}
.gen-h{font-family:var(--display);font-weight:400;font-size:20px;margin:20px 0 6px;display:flex;align-items:baseline;gap:10px}
.gen-h small{font-family:var(--ui);font-size:12px;color:var(--ink-3)}
.plist{list-style:none;margin:0;padding:0 16px;background:var(--sheet);border:1px solid var(--rule)}
.prow{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:10px 0;border-bottom:1px dotted var(--rule);font-size:13.5px}
.prow:last-child{border-bottom:0}
.prow .pn{flex:1 1 13em;min-width:0}
.prow .pn b{font-family:var(--body);font-weight:800;font-size:16px;margin-right:8px}
.prow .pr{color:var(--ink-3);font-size:12px}
.prow .pa{width:7em;font-variant-numeric:tabular-nums}
.prow .ps{display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--ink-3);width:11.5em}
.m10{display:inline-flex;align-items:center;gap:1.5px;vertical-align:-1px;margin-left:3px}
.m10 i{width:6px;height:9px;border:1px solid var(--rule);display:block}
.m10 i.on{background:var(--kin);border-color:var(--kin)}
.m10 b{font-size:11.5px;margin-left:5px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:1.4em}
.prow .pp{flex:1 1 9em;color:var(--ink-2);min-width:0}
.prow .pj{flex:1 1 15em;min-width:0}
.prow.proto .pn b{color:var(--shu)}
details.gone{margin-top:16px;background:var(--sheet);border:1px solid var(--rule);padding:10px 16px}
details.gone summary{cursor:pointer;font-size:13.5px;color:var(--ink-2)}
details.gone ul{margin:8px 0 0;padding-left:1.2em;font-size:13px;color:var(--ink-2);columns:2 20em}

/* 相場 */
.tbl-wrap{overflow-x:auto;margin-top:14px;border:1px solid var(--rule);background:var(--sheet)}
table.soba{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
.soba caption{text-align:left;font-family:var(--display);font-size:18px;padding:10px 12px 4px}
.soba th,.soba td{padding:8px 12px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
.soba thead th{font-size:11.5px;letter-spacing:.1em;color:var(--ink-2);font-weight:500;background:var(--sheet-2)}
.soba tbody th{text-align:left;font-family:var(--body);font-weight:800;font-size:15px}
.soba tbody th small{font-family:var(--ui);font-weight:400;color:var(--ink-3);font-size:11.5px;margin-left:2px}
.soba td{font-variant-numeric:tabular-nums}
.soba tr:last-child th,.soba tr:last-child td{border-bottom:0}
.spark{color:var(--ai-2);display:block;margin-left:auto}
.news{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.news li{font-size:13.5px;padding-left:14px;position:relative}
.news li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;background:var(--shu)}

/* 大福帳 */
.log{list-style:none;margin:14px 0 0;padding:0;background:var(--sheet);border:1px solid var(--rule)}
.log li{display:grid;grid-template-columns:8.5em minmax(0,1fr);gap:10px;padding:7px 14px;border-bottom:1px solid var(--rule);font-size:13.5px}
.log li:last-child{border-bottom:0}
.log .d{color:var(--ink-3);font-size:12px;padding-top:1px}
.log li.in .t::before{content:"入";color:var(--good);font-weight:700;margin-right:6px}
.log li.out .t::before{content:"出";color:var(--bad);font-weight:700;margin-right:6px}
.log li.ev .t::before{content:"事";color:var(--ai-2);font-weight:700;margin-right:6px}

/* 番付 */
.bz-wrap{overflow-x:auto;margin-top:14px;border:3px double var(--ink);background:var(--sheet)}
.bz{min-width:640px;padding:12px 14px 10px}
.bz-head{text-align:center;font-family:var(--display);font-size:clamp(22px,3vw,30px);letter-spacing:.2em;border-bottom:2px solid var(--ink);padding-bottom:6px}
.bz-row{display:flex;flex-direction:row-reverse;border-bottom:1px solid var(--ink)}
.bz-lab{font-family:var(--display);font-size:24px;padding:10px 8px;border-left:2px solid var(--ink);display:flex;align-items:center;justify-content:center}
.bz-cell{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 10px;border-left:1px solid var(--rule);min-width:52px}
.bz-cell:last-child{border-left:0}
.bz-cell .v{flex:none}
.bz-cell .r{font-size:12px;color:var(--ink-2);letter-spacing:.1em}
.bz-cell .pl{font-size:11px;color:var(--ink-3)}
.bz-cell .n{font-family:var(--display);line-height:1.1;color:var(--ink)}
.bz-cell .w{font-size:11px;color:var(--kin);font-family:var(--body)}
.bz-cell.me{background:var(--sheet-2)}
.bz-cell.me .n{color:var(--shu)}
.bz-cell.me .r{color:var(--shu);font-weight:700}
.bz-foot{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--ink-2);padding-top:6px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:14px;margin-top:14px;align-items:start}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.ch-grid{stroke:var(--rule);stroke-width:1}
.ch-ax{fill:var(--ink-3);font-size:11px;font-family:var(--ui)}
.ch-line{stroke:var(--ai-2);stroke-width:2;fill:none;stroke-linejoin:round}
.ch-area{fill:var(--ai-2);opacity:.12}
.ch-dot{fill:var(--ai-2);stroke:var(--sheet);stroke-width:2}
.ch-hl{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3}
.ctip{position:absolute;transform:translate(-50%,-120%);background:var(--bar-bg);color:var(--bar-fg);padding:4px 9px;font-size:12px;white-space:nowrap;pointer-events:none;font-variant-numeric:tabular-nums}
.hbars{display:flex;flex-direction:column;gap:8px}
.hbar{display:grid;grid-template-columns:5.5em minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.hbar .tr{height:12px;background:var(--sheet-2);position:relative}
.hbar .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--ai-2);border-radius:0 3px 3px 0}
.hbar .val{font-variant-numeric:tabular-nums;color:var(--ink-2);text-align:right}

/* 季節を送る */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bar-bg);color:var(--bar-fg);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20;box-shadow:0 -6px 18px rgba(0,0,0,.18)}
.bar-in{display:flex;align-items:center;gap:12px;padding-block:10px}
.bar .bw{font-family:var(--display);font-size:21px;white-space:nowrap;line-height:1.15}
.bar .bw small{display:block;font-family:var(--ui);font-size:11px;opacity:.7;letter-spacing:.08em}
.bar .tip{flex:1;min-width:0;font-size:12.5px;opacity:.82}

  if(se===2){ const A=H_AUTUMN[year]; if(A) s.harvest.cur=(s.harvest.cur??1)*(A[s.prov]??A.all??1); s.harvest.cur=Math.max(.25,s.harvest.cur??1); }
  if(!initial) updatePrices(s);
  if(se===0&&!initial){ const k=estKaku(s); if(k>0) addKaku(s,k); }
  if(SCRIPT[t]) for(const [id,extra] of SCRIPT[t]){ const e=makeEvent(s,id,extra); if(e) evs.push(e); }
  if(se===0&&!initial&&s.fam) familyYear(s,(text,warn)=>{ if(rep) rep.notes.push({text,warn:!!warn,fam:true}); log(s,text.replace(/。$/,''),warn?'out':'ev'); },evs);
  for(const id of s.pendingDefaults){ const l=s.loans.find(x=>x.id===id); const e=makeEvent(s,l&&l.kind==='shoya'?'default_shoya':'default',id); if(e) evs.push(e); }
  s.pendingDefaults=[];
  if(se===3&&s.harvest.last<.82){ const e=makeEvent(s,'nengu'); if(e) evs.push(e); }
  if(!initial&&t<TOTAL-1){ const e=randomEvent(s); if(e) evs.push(e); }
  const pr=checkPromotion(s); if(pr) evs.push(pr);
  genOffers(s);
  s.trust=clamp(s.trust+(Math.min(95,40+2*clamp(protoOf(s).toku||5,1,10)+estTrust(s))-s.trust)*.02,0,100);
  pushHist(s);
  return evs;
}
function blocking(q){
  if(q.type==='report') return q.notes.some(n=>n.alarm);
  const E=EV[q.id]; return !!(E.choices||E.major);
}
function advance(quiet){
  if(!S||S.queue.length||S.over) return;
  if(S.opt&&S.opt.autoOpt) ACT.optAll(true);
  const mg=runManagers(S);
  for(const n of autoDev(S)) mg.notes.push(n);
  staffSeason(S);
  const rep=endSeason(S,mg);
  if(netWorth(S)< -50*PL(S)){ S.over='bankrupt'; S.queue=[rep]; log(S,'身代限りとなる','out'); if(!quiet){save();render();} return; }
  S.t++;
  if(S.t>=TOTAL){ S.over='retire'; S.nwHist[TOTAL]=Math.round(netWorth(S)); S.queue=[rep]; log(S,'数え百二十六歳で大往生を遂げる','ev'); if(!quiet){save();render();} return; }
  const evs=beginSeason(S,rep,false);
  S.queue=(S.opt.report||blocking(rep))?[rep,...evs]:evs;
  ui.q={};
  if(!quiet){ save(); render(); }
}
function fastYear(n){
  if(!S||S.queue.length||S.over) return;
  const seen=[];
  for(let i=0;i<4*(n||1);i++){
    advance(true);
    if(S.over) break;
    while(S.queue.length&&!blocking(S.queue[0])){
      const q=S.queue.shift();
      if(q.type!=='report'){ const E=EV[q.id]; const ti=E.title(q.d,S); seen.push(ti); log(S,ti,'ev'); } else for(const n of q.notes) if(n.fam) seen.push(n.text.replace(/。$/,''));
    }
    if(S.queue.length) break;
  }
  save(); render();
  if(seen.length) toast('この間の出来事：'+seen.slice(-8).join('、'));
}

function riceCost(s,x){ const from=Math.min(Math.max(s.rice,0),x), buy=x-from; return {from,buy,cash:buy*s.P.rice*riceLF(s)*1.1}; }
const canGiveRice=(s,x)=>riceCost(s,x).cash<=Math.max(0,s.cash);
function giveRice(s,x){ const c=riceCost(s,x); s.rice-=c.from; if(c.cash) spend(s,c.cash); }

  taisei:{stamp:'王政',title:()=>'大政奉還',major:true,
    text:()=>`<p>十月、将軍慶喜公が大政を朝廷に奉還した。十二月には王政復古の大号令が下り、明治の新しい政府が立つという。二百六十年続いた徳川の世が終わる。</p><p>戦になるのか、新しい世が静かに来るのか。商いの行く末も見通せない。</p>`},
  shinchu:{stamp:'銭',title:()=>'真鍮四文銭',major:true,make:s=>{s.zeniRate*=1.08;return {r:Math.round(s.zeniRate)};},text:d=>`<p>御公儀が真鍮の四文銭を鋳造し始めた。銭が世に出回り、一両は銭${n0(d.r)}文ほどで替えられるようになった。</p>`},
  kanbatsu70:{stamp:'天候',title:()=>'明和の大旱魃',major:true,text:()=>`<p>夏になっても雨が降らず、川も井戸も干上がりかけている。秋の作柄は悪そうだ。米の値がじわじわと上がり始めた。</p>`},
  meiwa:{stamp:'火事',title:()=>'目黒行人坂の大火',major:true,
    make:s=>{s.fire.edo=Math.max(s.fire.edo,2.4);s.fire.loc=Math.max(s.fire.loc,1.15);return {};},
    text:()=>`<p>二月の末、江戸目黒の行人坂から出た火が南西の風にあおられ、九百を越す町々を焼き尽くした。</p><p>焼け跡の普請で江戸の材木は飛ぶように売れ、値は平時の二倍を越えている。</p>`},
  anei:{stamp:'改元',title:()=>'改元、安永',major:true,text:()=>`<p>「明和九年」は「めいわく年」に通じて縁起が悪いと、年号が安永と改まった。世が安く、永く続くようにとの願いがこもる。</p>`},
  tenmei_cold:{stamp:'天候',title:()=>'冷たい夏',major:true,text:()=>`<p>夏になっても北東の風が冷たく、稲の育ちがはかばかしくない。秋の作柄は望めそうにない。米の値がじわじわと上がり始めた。</p>`},
  asama:{stamp:'天災',title:()=>'浅間山の大焼け',major:true,
    make:s=>({heavy:['shinano','musashi'].includes(s.prov)}),
    text:d=>`<p>七月、信濃と上野の境にそびえる浅間山が大噴火した。灰と砂が関東から信濃一円に降り積もり、実りかけた稲を埋めた。</p><p>${d.heavy?'この村にも灰が厚く積もり、田はほとんど全滅だ。':'遠く離れたこの村でも冷たい夏が続き、作柄は悪い。'}米の値は日ごとに跳ね上がっている。凶作の年は打ちこわしにも気をつけたい。</p>`},
  famine84:{stamp:'飢饉',title:()=>'天明の飢饉',major:true,text:()=>`<p>春になっても米は乏しく、奥羽では村ごと死に絶えたところもあるという。米を多く抱える家は、打ちこわしの的になりかねない。信望が厚ければ村人も手出しはしないだろう。</p>`},
  tenmei_flood:{stamp:'天災',title:()=>'関東の大水と田沼さまの失脚',major:true,
    make:s=>({heavy:['shinano','musashi'].includes(s.prov)}),
    text:d=>`<p>七月、長雨で利根川や千曲川があふれ、田畑が泥に沈んだ。${d.heavy?'この村の田も大水をかぶった。':'この村の被害は小さいが、米の値は上がるだろう。'}</p><p>八月には老中田沼主殿頭さまが御役御免となった。商いを重んじた御政道も、これまでかもしれない。</p>`},
  uchi87:{stamp:'騒動',title:()=>'天明の打ちこわし',major:true,text:(d,s)=>`<p>五月、江戸と大坂で米屋や質屋が次々と打ちこわされた。米を買い占めて値をつり上げたと見なされた家が、群衆に襲われている。</p><p>当家の米蔵には米${n0(s.rice)}石。この季は特に気をつけたい。</p>`},
  kansei:{stamp:'御政道',title:()=>'松平越中守さま、老中首座へ',major:true,
    make:s=>{s.flags.kenyaku=true;return {};},
    text:()=>`<p>白河侯松平越中守さまが老中首座となり、御政道の立て直しが始まった（寛政の改革）。倹約令が出て、絹物や酒などの売れ行きは鈍るだろう。</p>`},
  kyoto_fire88:{stamp:'火事',title:()=>'天明の京都大火',major:true,
    make:s=>{ if(PV(s).kamigata) s.fire.kami=Math.max(s.fire.kami,1.6); if(s.prov==='yamashiro'){ const r=disaster(s,.2,100*PL(s),0); return {heavy:true,r}; } return {heavy:false,kami:!!PV(s).kamigata}; },
    text:d=>`<p>正月の末、京の鴨川の東から出た火が強い風にあおられ、御所や二条城まで焼き、京の町の大半が灰になった。</p>${d.heavy?`<p>京に近いこの村にも火が及び、${dmgText(d.r)}</p>`:d.kami?'<p>上方では普請の材木が足りなくなっている。</p>':''}`},
  kien:{stamp:'御触',title:()=>'棄捐令',major:true,
    make:s=>{let lost=0; for(const d of s.daimyo){const l=d.amt*.5; d.amt-=l; lost+=l; d.rate=Math.min(d.rate,.06);} return {lost};},
    text:d=>`<p>旗本・御家人の借金を棒引きにする棄捐令が出た。藩もこれにならい、町人からの借財を半分に減らすと申し渡してきた。</p><p>${d.lost>0?`大名貸の元金${ryo(d.lost)}が棒引きとなり、利息も年六分に下げられた。`:'さいわい、当家は武家に金を貸していない。'}</p>`},
  kakoi:{stamp:'御触',title:()=>'囲米の御沙汰',major:true,
    make:s=>({x:Math.max(10,Math.round(Math.min(s.koku*.3,30+s.koku*.04)))}),
    text:d=>`<p>飢饉に備えて村々で米を蓄えよとのお達しが出た。庄屋として、当家からも米${d.x}石を郷蔵に納めるよう求められている。</p>`,
    choices:(d,s)=>[
      {label:`米${d.x}石を郷蔵に納める`,sub:'信望と格式が上がる',dis:!canGiveRice(s,d.x),run:(d,s)=>{giveRice(s,d.x);addTrust(s,4);addKaku(s,d.x*.5);return `米${d.x}石を郷蔵に納めた。`;}},
      {label:'何とか断る',sub:'格式が下がる',run:(d,s)=>{addKaku(s,-20);addTrust(s,-2);return '代官所の覚えが悪くなった。';}},
    ]},
  kiri:{stamp:'御触',title:()=>'旧里帰農令',major:true,make:s=>{s.flags.kiri=true;return {};},text:()=>`<p>江戸に流れ込んだ百姓を村に帰す旧里帰農令が出た。村の働き手が戻り、しばらく人足の賃金は少し下がるだろう。</p>`},
  sadanobu_out:{stamp:'御政道',title:()=>'松平越中守さまの退任',major:true,make:s=>{s.flags.kenyaku=false;return {};},text:()=>`<p>松平越中守さまが老中を退かれた。倹約の締めつけは少しずつ緩みそうだ。</p>`},
  engumi:{stamp:'縁組',major:true,
    make:(s,id)=>{ const m=famById(s,id); if(!m) return null; const y=yearOf(s.t), pl=PL(s), nw=netWorth(s);
      return {id,name:m.name,rel:m.rel,age:ageAt(m,y),muko:pickName(s,MUKO_NAMES),msho:3+rnd()*5,mtoku:2+rnd()*6,cost:r5(Math.max(10*pl,nw*.002)),dowry:r5(Math.max(20*pl,nw*.004))}; },
    title:d=>`${d.name}の縁談`,
    text:d=>`<p>${esc(d.rel)}の${esc(d.name)}も数え${kanjiNum(d.age)}になり、縁談が持ち込まれている。</p><p>婿養子の候補は${esc(d.muko)}。商いの腕は十のうち${lv10(d.msho)}、人柄は十のうち${lv10(d.mtoku)}と聞く。婿に迎えれば家に残り、家業を任せられる。嫁に出せば持参金がかかるが、縁組先との付き合いで家の格は上がる。</p>`,
    choices:(d,s)=>[
      {label:`${d.muko}を婿養子に迎える（結納 ${ryo(d.cost)}）`,sub:`商才${lv10(d.msho)}・人徳${lv10(d.mtoku)}・家業を任せられる`,dis:s.cash<d.cost,run:(d,s)=>{ const w=famById(s,d.id); if(!w||!w.alive) return ''; spend(s,d.cost); const y=yearOf(s.t); const mk=addMember(s,{name:d.muko,sex:'m',born:y-20-Math.floor(rnd()*6),gen:w.gen,line:w.line,rel:`${w.name}の婿`,kind:'muko',spouse:w.id,sho:d.msho,toku:d.mtoku}); w.spouse=mk.id; addTrust(s,1); return `${d.muko}を${w.name}の婿に迎えた。`; }},
      {label:`他家へ嫁に出す（持参金 ${ryo(d.dowry)}）`,sub:'格式 +4・信望 +2・家の人数が減る',dis:s.cash<d.dowry,run:(d,s)=>{ const w=famById(s,d.id); if(!w) return ''; spend(s,d.dowry); const ho=leaveHouse(s,w,'嫁に出た'); addKaku(s,4); addTrust(s,2); return `${w.name}を嫁に出した。${ho}`; }},
      {label:'今年は見送る',run:()=>''},
    ]},
  yometori:{stamp:'縁組',major:true,
    make:(s,id)=>{ const m=famById(s,id); if(!m) return null; const y=yearOf(s.t), pl=PL(s), nw=netWorth(s);
      return {id,proto:m.kind==='proto',name:m.name,rel:m.rel,age:ageAt(m,y),yome:pickName(s,YOME_NAMES),ysho:2+rnd()*5,ytoku:3+rnd()*5,cost:r5(Math.max(10*pl,nw*.002)),gift:r5(Math.max(10*pl,nw*.002))}; },
    title:d=>d.proto?'嫁取りの話':`${d.name}の嫁取り`,
    text:d=>d.proto?`<p>数え${kanjiNum(d.age)}のあなたに、${esc(d.yome)}という娘との縁談が持ち込まれた。しっかり者で、帳場のことは十のうち${lv10(d.ysho)}ほど分かり、人柄は十のうち${lv10(d.ytoku)}という。</p>`:`<p>${esc(d.rel)}の${esc(d.name)}も数え${kanjiNum(d.age)}になった。${esc(d.yome)}という娘との縁談がある。嫁を迎えれば子が増え、家業を担う者も育つ。他家から婿養子に欲しいという話も来ている。</p>`,
    choices:(d,s)=>{ const a=[{label:`${d.yome}を${d.proto?'妻':'嫁'}に迎える（結納 ${ryo(d.cost)}）`,sub:`商才${lv10(d.ysho)}・人徳${lv10(d.ytoku)}`,dis:s.cash<d.cost,run:(d,s)=>{ const h=famById(s,d.id); if(!h||!h.alive) return ''; spend(s,d.cost); const y=yearOf(s.t); const w=addMember(s,{name:d.yome,sex:'f',born:y-16-Math.floor(rnd()*5),gen:h.gen,line:h.line,rel:h.kind==='proto'?'妻':`${h.name}の嫁`,kind:'yome',spouse:h.id,sho:d.ysho,toku:d.ytoku}); h.spouse=w.id; addTrust(s,1); return `${d.yome}を${h.kind==='proto'?'妻':h.name+'の嫁'}に迎えた。`; }}];
      if(!d.proto) a.push({label:`他家へ婿養子に出す（結納金 ${ryo(d.gift)}を受け取る）`,sub:'格式 +3・家の人数が減る',run:(d,s)=>{ const h=famById(s,d.id); if(!h) return ''; gain(s,d.gift); const ho=leaveHouse(s,h,'婿養子に出た'); addKaku(s,3); return `${h.name}を他家へ婿養子に出した。${ho}`; }});
      a.push({label:'今年は見送る',run:()=>''}); return a; }},
  bunka_fire:{stamp:'火事',title:()=>'文化の大火',major:true,
    make:s=>{s.fire.edo=Math.max(s.fire.edo,2.3);s.fire.loc=Math.max(s.fire.loc,1.12);return {};},
    text:()=>`<p>三月、江戸芝の車町から出た火が南西の風にあおられ、京橋、日本橋から浅草まで燃え広がった。焼け跡の普請で、江戸の材木は平時の二倍を越す値がついている。</p>`},
  kanreki:{stamp:'還暦',title:()=>'還暦',major:true,
    make:s=>({c:r5((30+netWorth(s)*.002/PL(s))*PL(s))}),
    text:()=>`<p>数え六十一、還暦を迎えた。十六で家督を継いでから四十五年。村の者たちが祝いの席を設けたいと言ってきた。</p>`,
    choices:(d,s)=>[
      {label:`村中を招いて祝宴を開く（${ryo(d.c)}）`,sub:'信望 +8',dis:s.cash<d.c,run:(d,s)=>{spend(s,d.c);addTrust(s,8);return '赤い頭巾をかぶり、村中と祝った。';}},
      {label:'内々で祝う',run:()=>'家の者だけで静かに祝った。'},
    ]},
  kiju:{stamp:'喜寿',title:()=>'喜寿',major:true,make:s=>{addTrust(s,3);return {};},text:()=>`<p>数え七十七、喜寿を迎えた。目も耳もまだ確かで、帳場に座れば子や孫たちが背筋を伸ばす。</p>`},
  beiju:{stamp:'米寿',title:()=>'米寿',major:true,make:s=>{addTrust(s,5);s.rice+=Math.min(20,Math.max(0,storeCap(s)-s.rice));return {};},text:()=>`<p>数え八十八、米寿を迎えた。村の者たちが祝いの米俵を担いできてくれた。</p>`},
  hakuju:{stamp:'白寿',title:()=>'白寿',major:true,make:s=>{addTrust(s,4);return {};},text:()=>`<p>数え九十九、白寿を迎えた。明和の世を知る者は、もう村にはあなたしかいない。</p>`},
  hyakuju:{stamp:'百寿',title:()=>'百歳の祝い',major:true,make:s=>{addTrust(s,6);addKaku(s,10);return {};},text:()=>`<p>数え百歳を迎えた。殿様から長寿を祝う品が届き、瓦版にも「百歳の翁、なお帳場に座る」と書き立てられた。</p>`},
  chaju:{stamp:'茶寿',title:()=>'茶寿',major:true,make:s=>{addTrust(s,5);return {};},text:()=>`<p>数え百八、茶寿を迎えた。異国の船が湊に来るという騒がしい世の中で、子や孫、曾孫までが祝いに顔をそろえた。</p>`},
  kouju:{stamp:'皇寿',title:()=>'皇寿',major:true,make:s=>{addTrust(s,6);addKaku(s,10);return {};},text:()=>`<p>数え百十一、皇寿を迎えた。殿様から長寿の祝いが届き、瓦版には「百十一歳の翁、なお帳場に座る」と書き立てられた。</p>`},
  daikanreki:{stamp:'還暦',title:()=>'大還暦',major:true,make:s=>{addTrust(s,6);return {};},text:()=>`<p>数え百二十一、二度目の還暦を迎えた。大還暦を祝う者など聞いたこともないと、東京の新聞記者まで訪ねてきた。</p>`},
  boshin:{stamp:'戦',title:()=>'戊辰の戦',major:true,
    make:s=>{s.impL.rice*=1.15;return {};},
    text:()=>`<p>正月、鳥羽と伏見で薩摩・長州の兵と旧幕府方がぶつかり、戦が始まった。官軍は江戸へ向けて東へ進んでいる。</p><p>新政府は軍資金として、三都や諸国の商人に御用金を求めている。</p>`},
  meiji:{stamp:'改元',title:()=>'明治改元',major:true,
    text:()=>`<p>年号が明治と改まり、これからは天皇一代に年号一つと定められた。江戸は東京と改められ、天皇も東へお移りになるという。</p>`},
  heimin:{stamp:'苗字',title:()=>'平民苗字許可令',major:true,
    make:s=>({has:!!s.surname,def:s.yago||'平屋'}),
    text:d=>d.has?`<p>平民も苗字を名乗ってよいとのお触れが出た。苗字御免は当家の誇りだったが、これからは誰もが苗字を持つ世になる。</p>`:`<p>平民も苗字を名乗ってよいとのお触れが出た。当家もいよいよ苗字を名乗ることにする。</p><label class="field">苗字<input id="surname" maxlength="4" value="${esc(d.def)}" autocomplete="off"></label>`,
    choices:d=>[{label:d.has?'心得た':'この苗字を名乗る',run:(d,s)=>{ if(d.has) return ''; const el=document.getElementById('surname'); const v=(el&&el.value||'').trim().slice(0,4); s.surname=v||d.def; return `以後、${s.surname}を名乗る。`; }}]},
  shinka:{stamp:'新貨',title:()=>'新貨条例',major:true,
    make:s=>{ const v=s.zeni>0?s.zeni/s.zeniRate:0; if(v>0){ s.cash+=v; s.zeni=0; } return {v}; },
    text:d=>`<p>新貨条例が出され、両に代わって円・銭・厘の新しいお金が定められた。一両は一円として数える。</p><p>銭相場もなくなった。${d.v>0?`手持ちの銭は${ryo(d.v)}に替えた。`:''}</p>`},
  haihan:{stamp:'廃藩',title:()=>'廃藩置県',major:true,
    make:s=>{ let before=0, after=0; const tOld=TT(1844,0), tNew=TT(1868,0), keep=[];
      for(const d of s.daimyo){ before+=d.amt; if(d.kind==='kosai'){keep.push(d);after+=d.amt;continue;} if(d.since<tOld) continue; if(d.since<tNew){ d.amt*=.5; d.rate=.02; } else d.rate=.04; d.kind='kosai'; keep.push(d); after+=d.amt; }
      const byRate={}; for(const d of keep){ const k=d.rate; if(byRate[k]){ byRate[k].amt+=d.amt; byRate[k].since=Math.min(byRate[k].since,d.since); } else byRate[k]=Object.assign({},d); }
      s.daimyo=Object.values(byRate); s.flags.haihan=true; s.flags.edoDecline=false; return {before,after}; },
    text:d=>`<p>七月、藩が廃されて府県が置かれた。藩の借財は新政府が引き継ぐが、天保十四年より前の古い貸しは棒引き、その後の貸しは公債に改められるという。</p><p>${d.before>0?`当家の大名貸${ryo(d.before)}は、公債${ryo(d.after)}に変わった。`:'さいわい、当家は藩に金を貸していない。'}これからは藩の御用金もない。余った金は公債で持つこともできる。</p>`},
  kocho:{stamp:'戸長',title:()=>'庄屋の廃止',major:true,
    make:s=>{s.flags.kocho=true;return {};},
    text:()=>`<p>庄屋・名主・年寄の役名が廃され、村には戸長が置かれることになった。あなたは引き続き村の戸長を務める。</p>`},
  tetsudo:{stamp:'鉄道',title:()=>'陸蒸気',major:true,
    text:()=>`<p>新橋と横浜の間に陸蒸気が走り始めた。異国の蒸気船も湊に増えている。東京への荷の運びは、これから速く安くなっていくだろう。</p>`},
  gakko:{stamp:'学制',title:()=>'小学校の普請',major:true,
    make:s=>({c:r5(Math.max(50*PL(s),netWorth(s)*.008))}),
    text:()=>`<p>学制が出され、村ごとに小学校を建てることになった。費用は村で出し合わねばならず、戸長として寄付を求められている。</p>`,
    choices:(d,s)=>[
      {label:`${ryo(d.c)}を寄付して学校を建てる`,sub:'信望 +10',dis:s.cash<d.c,run:(d,s)=>{spend(s,d.c);addTrust(s,10);addKaku(s,5);return '寺の隣に小学校が建った。子どもたちの声がにぎやかだ。';}},
      {label:'村の者に出させる',sub:'信望 −6',run:(d,s)=>{addTrust(s,-6);return '学校の普請費が村人の重荷になっている。';}},
    ]},
  chiso:{stamp:'地租',title:()=>'地租改正',major:true,
    make:s=>{s.flags.chiso=true; s.chisoBase=landPrice(s); return {b:s.chisoBase};},
    text:d=>`<p>地租改正の布告が出た。年貢は米ではなく、査定された地価の百分の三を金で納めることになる。当家の田畑は1石あたり${unitP(d.b)}と査定された。</p><p>小作人から受け取る小作米は手元に残る。米の値が上がれば得、下がれば地租が重くのしかかる。</p>`},
  ginko:{stamp:'銀行',title:()=>'国立銀行条例',major:true,
    make:s=>({ok:s.biz.ryo.lv>=2,c:r5(Math.max(3000*PL(s),netWorth(s)*.05))}),
    text:d=>`<p>国立銀行条例が改められ、各地で銀行が次々と生まれている。${d.ok?'当家の両替店にも、銀行を興さないかという話が来た。':'両替店を大きく営んでいれば、銀行を興せたかもしれない。'}</p>`,
    choices:(d,s)=>d.ok?[
      {label:`資本金${ryo(d.c)}を出して銀行を興す`,sub:'両替の口銭の元手が四倍になる',dis:s.cash<d.c,run:(d,s)=>{spend(s,d.c);s.invested.ryo+=d.c;s.flags.bank=true;addKaku(s,15);return '国立銀行の看板を掲げた。';}},
      {label:'両替店のまま続ける',run:()=>''},
    ]:[{label:'心得た',run:()=>''}]},
  seinan:{stamp:'戦',title:()=>'西南戦争',major:true,
    make:s=>{s.flags.seinanT=s.t;return {};},
    text:()=>`<p>二月、西郷隆盛が鹿児島で兵を挙げた。政府は戦費のために紙幣を刷り増し、物の値が上がり始めている。廻船は兵や兵糧を運んで大いに稼いでいる。</p><p>地租は百分の二・五に引き下げられた。</p>`},
  shuzozei:{stamp:'酒税',title:()=>'酒造税則',major:true,
    text:()=>`<p>酒造税則が改められ、酒の造石税が大きく引き上げられた。酒の値も上がるが、酒造りの儲けは細るだろう。</p>`},
  matsukata:{stamp:'紙幣',title:()=>'松方の紙幣整理',major:true,
    make:s=>{s.flags.deflation=true;return {};},
    text:()=>`<p>大蔵卿松方正義さまが、増えすぎた紙幣の整理に乗り出した。これから物の値は大きく下がりそうだ。</p><p>米の値が下がれば、地租を納めきれず借金に追われる百姓が増えるだろう。</p>`},
  chichibu:{stamp:'騒動',title:()=>'秩父事件',major:true,
    make:s=>({n:s.loans.filter(l=>l.status==='open').length}),
    text:d=>`<p>秩父で借金に苦しむ農民たちが蜂起した。物の値は下がり続け、この村でも借金の返済に困る家が多い。${d.n?`当家が金を貸している家も${d.n}軒ある。`:''}</p>`,
    choices:(d,s)=>[
      {label:'貸付の利息を半分にして、期限を一年延ばす',sub:'信望 +10',run:(d,s)=>{ for(const l of s.loans){ l.rate*=.5; l.due+=4; } addTrust(s,10); return '借り手たちが礼を言いに来た。'; }},
      {label:'証文どおり取り立てる',sub:'信望 −8',run:(d,s)=>{addTrust(s,-8);return '村の空気が冷たくなった。';}},
    ]},
  daioujou:{stamp:'臨終',title:()=>'最後の冬',major:true,
    text:()=>`<p>明治十年の冬。数え百二十六歳のあなたは、床に伏すことが多くなった。明和の世に十六で家督を継いでから百十一年、この冬が最後の季節となるだろう。</p><p>在庫や田畑は家産に数えられるが、売り時の品は売っておくのもよい。</p>`},
  fire_edo:{stamp:'火事',title:()=>`${EDO()}に大火`,
    make:s=>{const f=1.8+rnd()*.7; s.fire.edo=Math.max(s.fire.edo,f); if(!PV(s).mkt) s.fire.loc=Math.max(s.fire.loc,1.12); return {f:Math.round(s.fire.edo*10)/10,where:pick(['神田','日本橋','浅草','本所','芝','京橋','四谷','下谷'])};},
    text:d=>`<p>乾いた風の夜、${EDO()}の${d.where}から火が出て大火となった。焼け跡の普請に材木が要る。${EDO()}の材木相場は平時のおよそ${d.f}倍に跳ね上がっている。</p>`},
  kami_fire:{stamp:'火事',title:()=>'上方に大火',
    make:s=>{ if(PV(s).mkt) s.fire.kami=Math.max(s.fire.kami,1.6+rnd()*.5); else s.fire.loc=Math.max(s.fire.loc,1.15); return {m:!!PV(s).mkt}; },
    text:d=>d.m?`<p>大坂の町で大火があった。焼け跡の普請に材木が要り、京・大坂・堺の材木の値が跳ね上がった。江戸の相場には響かない。</p>`:`<p>大坂の町で大火があった。上方の材木問屋が諸国の材木を買いあさり、近在の材木の値が少し上がった。</p>`},
  goyokin:{stamp:'御用',title:d=>d.why||'御用金の仰せ',
    make:(s,why)=>({why:why||'',han:pick(hanList(s)).n,D:Math.max(r5(50*PL(s)),Math.round(netWorth(s)*(why?.05:.035)*(1+.3*s.flags.displeasure)/10)*10)}),
    text:(d,s)=>`<p>${d.why?`${d.why}として、御用金${ryo(d.D)}を差し出せとの仰せがあった。`:`${d.han||'藩'}の物入りにつき、勘定奉行より御用金${ryo(d.D)}を差し出せとの仰せがあった。`}${s.flags.kaibo&&!d.why?'黒船以来、海防の出費がかさんでいるらしい。':''}差し出せば家の格式は上がるが、返ってくる当てはない。</p>`,
    choices:(d,s)=>[
      {label:`${ryo(d.D)}を差し出す`,sub:`格式 +${n0(d.D/8/PL(s))}`,dis:s.cash<d.D,run:(d,s)=>{spend(s,d.D);addKaku(s,d.D/8/PL(s));addTrust(s,1);return `御用金${ryo(d.D)}を納めた。`;}},
      {label:`半分の${ryo(d.D/2)}で勘弁を願う`,sub:`格式 +${n0(d.D/25/PL(s))}`,dis:s.cash<d.D/2,run:(d,s)=>{spend(s,d.D/2);addKaku(s,d.D/25/PL(s));return '半分で勘弁してもらった。';}},
      {label:'手元不如意とお断りする',sub:'格式が下がり、次の御用金が重くなる',run:(d,s)=>{addKaku(s,-10);s.flags.displeasure++;return '藩の覚えが悪くなった。';}},
    ]},
  sodai:{stamp:'本願寺',title:()=>'門徒総代の推挙',
    make:s=>({c:r5(Math.max(40*PL(s),Math.max(0,s.cash)*.01))}),
    text:(d,s)=>`<p>末寺の御坊から、門徒総代を引き受けてほしいと頼まれた。村の講を束ね、寺の普請や法要の世話をする役で、本山からも名が通る。就任の挨拶に${ryo(d.c)}ほどの御礼が要る。</p>`,
    choices:(d,s)=>[
      {label:`門徒総代に就く（${ryo(d.c)}）`,sub:'功 +12・格式 +6・末寺を預かれるようになる',dis:s.cash<d.c,run:(d,s)=>{ spend(s,d.c); const H=honOf(s); H.sodai=true; H.ko+=12; addKaku(s,6); addTrust(s,2); return `末寺の門徒総代に就いた。${honUp(s).join('')}`; }},
      {label:'荷が重いと断る',sub:'信望 −1',run:(d,s)=>{ addTrust(s,-1); return '御坊は残念そうに引き下がった。'; }}]},
  sanpai:{stamp:'本願寺',title:()=>'東本願寺への参拝',
    make:s=>{ const pl=PL(s); return {trip:r5(((HON_FAR[s.prov]||3)+3)*pl),gift:r5(Math.max(60*pl,Math.max(0,s.cash)*.02))}; },
    text:(d,s)=>`<p>門徒の上洛が許され、京の東本願寺に参る機会が巡ってきた。御影堂の大屋根を仰ぎ、門主さまのお話を聞き、御裏方さまからもお言葉を賜れるという。路銀に${ryo(d.trip)}、御懇志に${ryo(d.gift)}ほど要る。</p>`,
    choices:(d,s)=>[
      {label:`参拝して御懇志を納める（${ryo(d.trip+d.gift)}）`,sub:'功 +大・格式 +8・信望 +3',dis:s.cash<d.trip+d.gift,run:(d,s)=>{ spend(s,d.trip+d.gift); const g=honKishin(s,d.gift); const H=honOf(s); H.ko+=10; H.sp=s.t; addKaku(s,8); addTrust(s,3); const p=protoOf(s); if(p.kind==='proto') p.toku=Math.min(10,(p.toku||1)+.1); return `東本願寺に参り、門主さまに御目通りが叶い、御裏方さまからは御言葉を賜った。功 +${n1(g+10)}。${honUp(s).join('')}`; }},
      {label:`参るだけにする（${ryo(d.trip)}）`,sub:'功 +4・格式 +2',dis:s.cash<d.trip,run:(d,s)=>{ spend(s,d.trip); const H=honOf(s); H.ko+=4; H.sp=s.t; addKaku(s,2); return `御影堂に参り、門主さまのお姿を遠くから拝んだ。${honUp(s).join('')}`; }},
      {label:'今回は見送る',run:(d,s)=>{ honOf(s).sp=s.t-12; return ''; }}]},
  matsuji:{stamp:'本願寺',title:()=>'末寺を預かる願い',
    make:s=>({name:pick(['西福寺','称念寺','専光寺','願正寺','浄円寺','光徳寺']),c:r5(Math.max(50*PL(s),Math.max(0,s.cash)*.01))}),
    text:(d,s)=>`<p>${esc(PV(s).village)}の近くの末寺・${esc(d.name)}は住職が老いて後を継ぐ者がない。門徒総代のあなたに、寺を預かり世話をしてほしいと願い出があった。預かれば、寺の普請や拡張を思うままに進められる。</p>`,
    choices:(d,s)=>[
      {label:`${d.name}を預かる（${ryo(d.c)}）`,sub:'本願寺の帳で改修・拡張ができる',dis:s.cash<d.c,run:(d,s)=>{ spend(s,d.c); honOf(s).temple={name:d.name,size:1,lv:{hondo:1,mon:0,hei:0,niwa:0,kura:0,sonota:0},inv:d.c}; addKaku(s,3); addTrust(s,2); return `${d.name}を預かることになった。本願寺の帳から改修や拡張ができる。`; }},
      {label:'荷が重いと断る',run:()=>''}]},
  rennyo:{stamp:'遠忌',title:()=>'蓮如上人三百五十回御遠忌',
    make:s=>honEvMake(s,.6),
    text:()=>`<p>本願寺で蓮如上人の三百五十回御遠忌が勤まる。御坊を通じて、門徒の家々に御懇志が求められている。</p>`,
    choices:(d,s)=>honEvChoices(d,s)},
  shinran:{stamp:'遠忌',title:()=>'親鸞聖人六百回大遠忌',
    make:s=>honEvMake(s,1),
    text:()=>`<p>宗祖親鸞聖人の六百回大遠忌が本山で盛大に勤まる。諸国から門徒が上り、御影堂の御修復にも莫大な御懇志が要る。</p>`,
    choices:(d,s)=>honEvChoices(d,s)},
  matsuri:{stamp:'寄進',title:()=>'秋祭りの寄進',
    make:s=>({a:Math.round(clamp(5+netWorth(s)*.003/PL(s),5,100)*PL(s))}),
    text:()=>`<p>鎮守の秋祭りが近い。村の若い衆が、神輿の修繕と幟の新調のために寄進を願い出てきた。</p>`,
    choices:(d,s)=>[
      {label:`${ryo(d.a)}を寄進する`,sub:'信望 +5',dis:s.cash<d.a,run:(d,s)=>{spend(s,d.a);addTrust(s,5);addKaku(s,1);return '寄進した。祭りは大いににぎわった。';}},
      {label:'今年は勘弁してもらう',sub:'信望 −4',run:(d,s)=>{addTrust(s,-4);return '若い衆はしぶしぶ引き下がった。';}},
    ]},
  yosui:{stamp:'普請',title:()=>'用水普請',
    make:s=>({c:r5((30+s.koku*.6)*PL(s))}),
    text:()=>`<p>村の用水路が傷み、田に水が回りきらない。村役人の寄合で、普請の費用を庄屋に出してほしいと話が出た。直せば、田の実りはこの先ずっと良くなる。</p>`,
    choices:(d,s)=>[
      {label:`${ryo(d.c)}を出して普請する`,sub:'収穫が五分増え、信望も上がる',dis:s.cash<d.c,run:(d,s)=>{spend(s,d.c);s.landBonus=Math.min(.4,s.landBonus+.05);addTrust(s,6);addKaku(s,4);return '用水路が直った。田に水が行き渡る。';}},
      {label:'見送る',run:(d,s)=>{addTrust(s,-1);return '';}},
    ]},
  shinden:{stamp:'開発',title:()=>'新田開発の話',
    make:s=>{const pl=PL(s); const c=r5(clamp(300+netWorth(s)*.02/pl,300,1500)*pl); return {c,k:Math.round(c/(5*pl))};},
    text:d=>`<p>村はずれの葦原を拓いて新田にしようという話が持ち込まれた。元手${ryo(d.c)}を出せば、二年後には持高${d.k}石ほどの田になる見込みだ。ただし水害で失敗することもある。</p>`,
    choices:(d,s)=>[
      {label:`元手${ryo(d.c)}を出す`,sub:'二年後に持高が増える（四度に一度は失敗）',dis:s.cash<d.c,run:(d,s)=>{spend(s,d.c);s.projects.push({type:'shinden',cost:d.c,koku:d.k,ready:s.t+8,p:.75,done:false});s.flags.lastShinden=s.t;return '新田の鍬入れが始まった。';}},
      {label:'見送る',run:(d,s)=>{s.flags.lastShinden=s.t;return '';}},
    ]},
  project_end:{stamp:'開発',major:true,
    make:(s,p)=>{ const t=p.type||'shinden', ok=rnd()<(p.p||.75);
      if(ok){ if(t==='kangai'){ s.landBonus=Math.min(.4,s.landBonus+.05); addTrust(s,5); addKaku(s,4); } else { s.koku+=p.koku; addTrust(s,t==='kaikon'?2:5); addKaku(s,t==='kantaku'?15:t==='kaikon'?3:t==='kanden'?8:10); } }
      else { if(t==='kaikon') s.wild+=p.koku; if(t==='kantaku') s.flat+=p.koku; if(t==='kanden') s.irr=(s.irr||0)+p.koku; }
      let bonus=0; if(ok&&t!=='kangai'&&p.koku){ bonus=Math.round(p.koku*.3*PL(s)*100)/100; gain(s,bonus); s.stats.sachi=(s.stats.sachi||0)+bonus; }
      return {t,ok,k:p.koku||0,c:p.cost,bonus}; },
    title:d=>({shinden:['新田、成る','新田、流される'],kaikon:['開墾、成る','開墾、実らず'],kantaku:['干拓、成る','干拓の堤、切れる'],kangai:['用水路、通る','用水普請、しくじる'],kanden:['灌漑の新田、成る','用水、届かず']})[d.t][d.ok?0:1],
    text:d=>({
      shinden:[`<p>二年がかりの新田が実り、検地を受けて持高${d.k}石が加わった。村の者も新しい田を喜んでいる。</p>`,`<p>大水で堤が切れ、拓きかけの新田は泥に埋もれた。元手${ryo(d.c)}は戻らない。</p>`],
      kaikon:[`<p>荒れ地を拓いた田畑が実を結び、検地を受けて持高${n0(d.k)}石が加わった。</p>`,`<p>拓いた土地は石が多く水も乏しく、田畑にはならなかった。元手${ryo(d.c)}は戻らないが、荒れ地はまた拓ける。</p>`],
      kantaku:[`<p>三年がかりの干拓が成り、潮止めの堤の内に新田が広がった。検地を受けて持高${n0(d.k)}石が加わった。</p>`,`<p>大潮と嵐で潮止めの堤が切れ、干拓地は水に沈んだ。元手${ryo(d.c)}は戻らない。</p>`],
      kanden:[`<p>二年がかりで用水路が通り、乾いた畑や野が水田に変わった。検地を受けて持高${n0(d.k)}石が加わった。</p>`,`<p>用水路の水がうまく届かず、田にはならなかった。元手${ryo(d.c)}は戻らないが、また拓き直せる。</p>`],
      kangai:[`<p>用水路が通り、田に水が行き渡るようになった。収穫が五分増える。</p>`,`<p>用水路の勾配を誤り、水がうまく流れなかった。元手${ryo(d.c)}は戻らない。</p>`],
    })[d.t][d.ok?0:1]+(d.ok&&d.bonus?`<p>領主より新田開発の報奨金${ryo(d.bonus)}が下された。</p>`:'')},
  rumor:{stamp:'噂',title:()=>'行商人の噂',
    make:s=>{const g=pick(['rice','sake','shoyu','miso','wood','sumi','abura','kami','momen','gofuku','cha','kusuri']); const up=rnd()<.5; const m=(g==='rice'||g==='miso')?'L':pick(PV(s).mkt&&hasK(s,g)?['L','K','E']:['L','E']); const f=up?1.18+rnd()*.1:.82-rnd()*.08; if(rnd()<.75) s.shock={g,f,m}; return {g,up,m};},
    text:d=>`<p>出入りの行商人が声をひそめて言う。「来季は${d.m==='E'?EDO():d.m==='K'?'京・大坂':'このあたり'}で${GOODS[d.g].name}の値が${d.up?'上がり':'下がり'}ますよ」。噂がどこまで当たるかはわからない。</p>`},
  mizu:{stamp:'争論',title:()=>'水争い',
    make:s=>({c:r5(20*PL(s))}),
    text:()=>`<p>日照りが続き、隣村と用水の取り合いになった。双方の若い衆が鎌を手に睨み合っている。</p>`,
    choices:(d,s)=>[
      {label:`酒肴と金${ryo(d.c)}を持って仲裁に出る`,sub:'信望 +7',dis:s.cash<d.c,run:(d,s)=>{spend(s,d.c);addTrust(s,7);return '双方の顔を立てて丸く収めた。';}},
      {label:'代官所の裁きに任せる',sub:'信望 −6',run:(d,s)=>{addTrust(s,-6);return '裁きは長引き、村人は庄屋を頼りなく思っている。';}},
    ]},
  ekibyo:{stamp:'疫病',title:()=>'はやり病',
    make:s=>{s.flags.ekibyo=2;return {c:r5(15*PL(s))};},
    text:()=>`<p>村に疱瘡がはやり始めた。寝込む者が多く、しばらくは人手が足りず、人足の賃金も高くつく。</p>`,
    choices:(d,s)=>[
      {label:`医者と薬を手配する（${ryo(d.c)}）`,sub:'信望 +6',dis:s.cash<d.c,run:(d,s)=>{spend(s,d.c);addTrust(s,6);return '町から医者を呼び、薬を配った。';}},
      {label:'様子を見る',sub:'信望 −3',run:(d,s)=>{addTrust(s,-3);return '';}},
    ]},
  tozai:{stamp:'杜氏',title:()=>'名杜氏の売り込み',
    make:s=>({fee:r5((25+10*s.biz.sake.lv)*PL(s))}),
    text:()=>`<p>丹波から腕の良い杜氏が訪ねてきた。今冬の仕込みを任せてくれれば、いつもより出来の良い酒を造ってみせるという。</p>`,
    choices:(d,s)=>[
      {label:`${ryo(d.fee)}で雇う`,sub:'今冬の酒の出来高が一割五分増える',dis:s.cash<d.fee,run:(d,s)=>{spend(s,d.fee);s.flags.tozai=1.15;return '名杜氏が酒蔵に入った。';}},
      {label:'断る',run:()=>''},
    ]},
  thief:{stamp:'盗難',title:()=>'盗賊',
    make:s=>{const loss=Math.min(Math.round(s.cash*.1),Math.round(200*PL(s))); if(loss<5) return null; s.cash-=loss; return {loss};},
    text:d=>`<p>夜半、土蔵が破られ、金${ryo(d.loss)}が盗まれた。両替商のような頑丈な金蔵があれば防げたかもしれない。</p>`},
  zeni:{stamp:'銭',title:()=>'銭の鋳造',
    make:s=>{s.zeniRate*=1.07;return {r:Math.round(s.zeniRate)};},
    text:d=>`<p>御公儀が銭を大量に鋳造しているという。銭の値打ちが下がり、一両は銭${n0(d.r)}文ほどで替えられるようになった。</p>`},

function pills(s,key){

  if(B.type==='make'){ const L=B.actL||'仕込み'; if(B.seasons.length===4) P(true,'通年',''); else P(B.seasons.includes(se),L+'時',`${L}は${seasonsText(B.seasons)}`); }
  else if(B.type==='trade'){ if(B.seasons.length===4) P(true,'通年',''); else P(B.seasons.includes(se),'仕入れ時','冬は漁がない'); }

let toastTimer=0;
function toast(msg,bad){ if(!msg) return; const el=document.getElementById('toast'); el.textContent=msg; el.className='toast'+(bad?' err':''); el.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>{el.hidden=true;},bad?3400:Math.min(6000,2600+msg.length*30)); }
const SLOT_N=4, SLOTN=['','一の帳','二の帳','三の帳','四の帳'], SLOTKEY=i=>'shoya-hanjoki-s'+i, METAKEY='shoya-hanjoki-meta';
function readMeta(){ try{ return JSON.parse(localStorage.getItem(METAKEY)||'{}')||{}; }catch(e){ return {}; } }
function writeMeta(m){ try{ localStorage.setItem(METAKEY,JSON.stringify(m)); }catch(e){} }
function metaOf(s){ const prev=S; S=s; try{ const P=PV(s); return {mon:s.mon||'nihiki',yago:s.yago,given:s.given,surname:s.surname||'',age:ageOf(s),gen:s.gen||1,prov:P.name,village:P.village,t:Math.min(s.t,TOTAL-1),over:s.over||false,nw:ryo(netWorth(s)),at:Date.now()}; } finally{ S=prev; } }
function slotData(i){ try{ const j=localStorage.getItem(SLOTKEY(i)); return j?migrate(JSON.parse(j)):null; }catch(e){ return null; } }
function writeSlot(i,s){ localStorage.setItem(SLOTKEY(i),JSON.stringify(s)); const m=readMeta(); m[i]=metaOf(s); writeMeta(m); }
function clearSlot(i){ try{ localStorage.removeItem(SLOTKEY(i)); }catch(e){} const m=readMeta(); delete m[i]; writeMeta(m); }
function allMeta(){
  const m=readMeta(), out=[null]; let dirty=false;
  for(let i=1;i<=SLOT_N;i++){ let x=m[i]||null; let has=false; try{ has=!!localStorage.getItem(SLOTKEY(i)); }catch(e){}
    if(x&&!has){ x=null; delete m[i]; dirty=true; }
    else if(!x&&has){ const o=slotData(i); if(o){ x=metaOf(o); m[i]=x; dirty=true; } }
    out.push(x); }
  if(dirty) writeMeta(m);
  return out;
}
const firstFree=a=>{ a=a||allMeta(); for(let i=1;i<=SLOT_N;i++) if(!a[i]) return i; return 0; };
function migrateLegacy(){ try{ const j=localStorage.getItem(KEY); if(!j) return; const a=allMeta(), i=firstFree(a); if(!i) return; const o=migrate(JSON.parse(j)); if(o) writeSlot(i,o); localStorage.removeItem(KEY); if(!ui.lastSlot) ui.lastSlot=i; }catch(e){} }

const fmtAt=ts=>{ if(!ts) return ''; const d=new Date(ts); return `${d.getMonth()+1}月${d.getDate()}日 ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`; };

function migrate(o){
  if(!o||![5,6,7,8,9,10].includes(o.v)||!PROV[o.prov]) return null;
  if(o.v===6){ const P=PROV[o.prov], d=RES6[o.prov]; if(d){ o.wild=(o.wild||0)+(P.wild||0)-d[0]; o.irr=(o.irr||0)+(P.irr||0)-d[1]; o.flat=(o.flat||0)+(P.flat||0)-d[2]; } o.v=7; }
  if(o.v===5){
    const P=PROV[o.prov], old=OLD_RES[o.prov]||[0,0];
    o.wild=Math.max(0,(P.wild||0)-(old[0]-(o.wild||0)));
    o.flat=Math.max(0,(P.flat||0)-(old[1]-(o.flat||0)));
    o.irr=P.irr||0;
    for(const k of BIZ_ORDER){ if(!o.biz[k]) o.biz[k]={lv:0,mgr:false,fam:null}; if(o.invested[k]==null) o.invested[k]=0; }
    for(const g of PROD_KEYS){ if(o.inv[g]==null) o.inv[g]=0; if(o.stats[g]==null) o.stats[g]=0; }
    const added=GOOD_KEYS.filter(g=>o.P[g]==null);
    for(const g of added){ o.P[g]=GOODS[g].base*PLt(o.t); o.impL[g]=1; o.impK[g]=1; o.impE[g]=1; o.impW[g]=1; o.hist[g]=[]; }
    if(added.length){ const T=targets(o); for(const g of added) o.P[g]=T[g]; }
    o.v=7;
  }
  if(o.v===7){ const y=yearOf(Math.min(o.t,TOTAL-1));
    for(const m of o.fam){
      if(m.sho==null) m.sho=clamp(((m.skill||1)*(1+Math.min(.25,(m.exp||0)*.004))-.7)/.08,1,10);
      if(m.toku==null) m.toku=clamp(1+Math.max(0,ageAt(m,y)-6)*.12+rnd()*2,1,9);
      if(m.apt==null) m.apt=1; if(m.role===undefined){ m.role=null; m.at=null; }
      if(m.alive&&m.inHouse){ const a=ageAt(m,y);
        if(m.kind==='elder'&&m.gen<=-2) m.dieAt=Math.max(a+1,101+Math.floor(rnd()*10));
        else if((m.kind==='elder'||m.kind==='mother')&&m.gen===-1) m.dieAt=Math.max(a+1,111+Math.floor(rnd()*10));
        else if(m.kind==='blood') m.dieAt=Math.max(a+1,111+Math.floor(rnd()*10)); } }
    o.v=8; }
  if(o.v===8){ if(!o.est) o.est={hon:{yashiki:1,kura:1,niwa:1},bet:{yashiki:0,kura:0,niwa:0},inv:0}; o.v=9; }
  if(o.est) estNorm(o);
  if(!o.impK){ o.impK={}; GOOD_KEYS.forEach(g=>{ o.impK[g]=1; }); } else GOOD_KEYS.forEach(g=>{ if(o.impK[g]==null) o.impK[g]=1; });
  if(o.fire&&o.fire.kami==null) o.fire.kami=1;
  if(o.v===9) o.v=10;
  for(const k of BIZ_ORDER){ if(!o.biz[k]) o.biz[k]={lv:0,mgr:false,fam:null}; if(o.invested[k]==null) o.invested[k]=0; }
  for(const g of PROD_KEYS){ if(o.inv[g]==null) o.inv[g]=0; if(o.stats[g]==null) o.stats[g]=0; }
  { const added=GOOD_KEYS.filter(g=>o.P[g]==null); for(const g of added){ o.P[g]=GOODS[g].base*PLt(o.t); o.impL[g]=1; o.impK[g]=1; o.impE[g]=1; o.impW[g]=1; o.hist[g]=[]; } if(added.length){ const T=targets(o); for(const g of added) o.P[g]=T[g]; } }
  if(o.shichiP==null) o.shichiP=0;
  if(!o.hon) o.hon={lv:0,ko:0,sk:0,st:-1,mt:-1,tot:0};
  if(o.irr==null) o.irr=0;
  return o;
}
function choose(i){
  const q=S.queue[0]; if(!q) return;
  const E=EV[q.id]; const chs=E.choices?E.choices(q.d,S):[{label:'心得た',run:()=>''}];
  const c=chs[i]; if(!c||c.dis) return;
  const title=E.title(q.d,S), msg=c.run(q.d,S)||'';
  log(S,msg?`${title}：${msg}`:title,'ev');
  S.queue.shift(); save(); render(); if(msg) toast(msg);
}
(()=>{ const tb=document.getElementById('totop'); if(tb) window.addEventListener('scroll',()=>tb.classList.toggle('show',window.scrollY>600),{passive:true}); })();
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el||el.disabled) return;
  let [a,...args]=el.dataset.act.split(':');
  const pc=ui.confirm; ui.confirm=null;
  if(a==='cfm'){ const key=args.join(':'); if(pc!=='cfm:'+key){ ui.confirm='cfm:'+key; render(); return; } a=args.shift(); }
  switch(a){
    case 'saveOpen': if(S&&!S.queue.length){ ui.saveOpen=true; render(); } return;
    case 'saveClose': ui.saveOpen=false; render(); return;
    case 'slotTgt': ui.newSlot=+args[0]; render(); return;
    case 'slotLoad': { const i=+args[0], o=slotData(i); if(!o){ clearSlot(i); render(); toast('その帳は読めなかった。',true); return; } if(S) save(); S=o; ui.slot=i; ui.lastSlot=i; ui.saveOpen=false; ui.q={}; ui.tab='biz'; saveUi(); render(); window.scrollTo({top:0}); toast(`${SLOTN[i]}を開いた（${o.yago} ${o.given}・${ageLabel(o)}）。`); return; }
    case 'slotCopy': { const i=+args[0]; if(!S||i===ui.slot) return; const used=!!allMeta()[i]; if(used&&pc!=='copy:'+i){ ui.confirm='copy:'+i; render(); return; } try{ writeSlot(i,S); toast(`いまの家を${SLOTN[i]}に写した。このまま${SLOTN[ui.slot]}で続ける。`); }catch(err){ toast('写せなかった。ほかの帳を消して空きを作ってほしい。',true); } render(); return; }
    case 'slotDel': { const i=+args[0]; if(S&&i===ui.slot) return; if(pc!=='del:'+i){ ui.confirm='del:'+i; render(); return; } clearSlot(i); if(ui.newSlot===i) ui.newSlot=0; toast(`${SLOTN[i]}を消した。`); render(); return; }
    case 'toTitle': save(); ui.lastSlot=ui.slot; S=null; ui.saveOpen=false; ui.q={}; ui.newSlot=0; saveUi(); render(); window.scrollTo({top:0}); return;
    case 'tab': ui.tab=args[0]; render(); window.scrollTo({top:Math.min(window.scrollY,(document.querySelector('.tabs')||{offsetTop:0}).offsetTop)}); return;
    case 'cat': ui.cat=args[0]; saveUi(); render(); return;
    case 'view': ui.view=args[0]==='list'?'list':'card'; saveUi(); render(); return;
    case 'mon': { const k=args[0]; if(!KAMON_ORDER.includes(k)) return; if(S){ if(S.queue.length||S.over) return; S.mon=k; save(); render(); toast(`家紋を${KAMON[k].name}に改めた。`); } else { ui.mon=k; render(); } return; }
    case 'goto': { const k=args[0]; ui.view='card'; if(!document.getElementById('card-'+k)||ui.cat==='now') ui.cat=isRunning(S,k)?'run':'all'; saveUi(); render(); const el=document.getElementById('card-'+k); if(el){ el.scrollIntoView({block:'start'}); const f=el.querySelector('input,button.pri'); if(f) try{ f.focus({preventScroll:true}); }catch(e){} } return; }
    case 'start': {
      const am=allMeta(), tgt=ui.newSlot||firstFree(am)||ui.lastSlot||1;
      if(am[tgt]&&pc!=='new'){ ui.confirm='new'; render(); return; }
      const y=(document.getElementById('f-yago')?.value||'').trim()||'平屋', g=(document.getElementById('f-given')?.value||'').trim()||'治兵衛';
      ui.yago=y; ui.given=g; ui.q={}; ui.tab='biz'; ui.cat='all'; ui.slot=tgt; ui.lastSlot=tgt; ui.newSlot=0; ui.saveOpen=false;
      S=newGame(ui.prov,y,g); S.mon=KAMON[ui.mon]?ui.mon:'nihiki'; save(); saveUi(); render(); window.scrollTo({top:0}); return; }
    case 'restart': save(); ui.lastSlot=ui.slot; S=null; ui.q={}; ui.newSlot=0; saveUi(); render(); window.scrollTo({top:0}); return;
    case 'next': if(S&&S.queue[0]&&S.queue[0].type==='report'){ S.queue.shift(); save(); render(); } return;
    case 'ch': choose(+args[0]); return;
    case 'advance': advance(); return;
    case 'fast': fastYear(+args[0]||1); return;
    case 'optrep': if(S){ S.opt.report=!S.opt.report; save(); render(); } return;
    case 'optcredit': if(S){ S.opt.credit=!S.opt.credit; save(); render(); toast(S.opt.credit?'手元金が足りないときは、番頭が家産の二割五分まで掛けで仕入れる。借財には季に三分の利息がつく。':'番頭は手元金の範囲でしか仕入れない。'); } return;
    case 'max': { if(!S) return; const k=args[0]; ui.q[k]=String(maxQ(S,k)); const inp=document.getElementById('q-'+k); if(inp) inp.value=ui.q[k]; updatePreviews(); return; }
  }
  if(!S||S.queue.length||S.over) return;
  const f=ACT[a]; if(!f) return;
  const r=f(...args);
  if(r){ if(r.ok){ if(r.clear) delete ui.q[r.clear]; save(); render(); } toast(r.msg,!r.ok); }
});
document.addEventListener('toggle',e=>{ if(e.target&&e.target.id==='monpick') ui.monOpen=e.target.open; },true);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&ui.saveOpen&&S){ ui.saveOpen=false; render(); } });
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.q){ ui.q[t.dataset.q]=t.value; updatePreviews(); return; }
  if(t.dataset&&t.dataset.opt==='reserve'&&S){ const v=parseFloat(t.value); S.opt.reserve=isFinite(v)?Math.max(0,v):0; save(); return; }
  if(t.id==='f-yago'){ ui.yago=t.value; const ch=(t.value.trim()||'平')[0], r=document.getElementById('rakkan'); if(r) r.textContent=ch; document.querySelectorAll('.mon-ch').forEach(x=>{x.textContent=ch;}); }
  if(t.id==='f-given') ui.given=t.value;
});
document.addEventListener('change',e=>{ const t=e.target; if(t.name==='prov'){ ui.prov=t.value; return; }
  if(t.dataset&&(t.dataset.assign||t.dataset.assignm||t.dataset.role)&&S&&!S.queue.length&&!S.over){ const r=t.dataset.role?ACT.role(t.dataset.role,t.value):t.dataset.assign?ACT.assign(t.dataset.assign,t.value):ACT.assignM(t.dataset.assignm,t.value); if(r){ if(r.ok){ save(); render(); } toast(r.msg,!r.ok); } } });

function boot(data){
  migrateLegacy();
  if(data&&data.S){ const m=migrate(data.S); if(m){ S=m; if(data.ui) Object.assign(ui,data.ui); } }
  render();
}

if(hot&&typeof hot.snapshot==='function'){ try{ hot.snapshot(()=>({S,ui})); }catch(e){} }
if(hot&&typeof hot.ready==='function') hot.ready(boot); else boot((hot&&hot.data)||{});
})();
