<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="口丹庄屋豪商伝"><meta name="theme-color" content="#b03a27"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"></head><body>
<title>口丹庄屋豪商傳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Yuji+Syuku&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root {
  /* 配置: 頭に藍の暖簾、左に丹波の絵図、右に大福帳(帳場) */
  --bg: #E5E9E6;
  --paper: #F6F7F3;
  --paper-2: #ECEFEA;
  --ink: #1A2738;
  --ink-2: #4E5C6B;
  --ink-3: #7B8794;
  --line: #C8CFCF;
  --ai: #25476E;
  --ai-2: #DCE5EF;
  --on-ai: #F4F0E5;
  --kin: #94650C;
  --kin-2: #F1E4C3;
  --shu: #B03A27;
  --moegi: #3B6D36;
  --noren: #1D3A5D;
  --noren-ink: #F2EDE0;
  --land: #E1E5D9;
  --land-2: #D3DAC8;
  --sea: #BFD2DC;
  --river: #7FA5BE;
  --road: #9B8E77;
  --halo: #E1E5D9;
  --f-brush: 'Yuji Syuku', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
  --f-body: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', 'Meiryo', system-ui, sans-serif;
  --f-hand: 'Klee One', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1823; --paper: #152131; --paper-2: #1B2939; --ink: #ECE6D7; --ink-2: #AAB3BD; --ink-3: #788490; --line: #2B3B4D;
    --ai: #8FB6DD; --ai-2: #1C2F46; --on-ai: #0F1823; --kin: #E2B352; --kin-2: #372C16; --shu: #E8846C; --moegi: #93C27C;
    --noren: #12304F; --noren-ink: #EEE7D5; --land: #17253A; --land-2: #1D2E45; --sea: #0A121B; --river: #3D6389; --road: #8A7C64; --halo: #17253A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1823; --paper: #152131; --paper-2: #1B2939; --ink: #ECE6D7; --ink-2: #AAB3BD; --ink-3: #788490; --line: #2B3B4D;
  --ai: #8FB6DD; --ai-2: #1C2F46; --on-ai: #0F1823; --kin: #E2B352; --kin-2: #372C16; --shu: #E8846C; --moegi: #93C27C;
  --noren: #12304F; --noren-ink: #EEE7D5; --land: #17253A; --land-2: #1D2E45; --sea: #0A121B; --river: #3D6389; --road: #8A7C64; --halo: #17253A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
button, input, select { font: inherit; color: inherit; }
.wrap { max-width: 1480px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.kin { color: var(--kin); }
.good { color: var(--moegi); }
.bad { color: var(--shu); }
:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }

/* ---------- 暖簾 ---------- */
.noren { background: var(--noren); color: var(--noren-ink); position: relative; overflow: hidden; }
.noren::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 58%; pointer-events: none;
  background:
    linear-gradient(90deg, transparent calc(25% - 1.5px), var(--bg) calc(25% - 1.5px), var(--bg) calc(25% + 1.5px), transparent calc(25% + 1.5px)),
    linear-gradient(90deg, transparent calc(50% - 1.5px), var(--bg) calc(50% - 1.5px), var(--bg) calc(50% + 1.5px), transparent calc(50% + 1.5px)),
    linear-gradient(90deg, transparent calc(75% - 1.5px), var(--bg) calc(75% - 1.5px), var(--bg) calc(75% + 1.5px), transparent calc(75% + 1.5px));
}
.noren-in { display: flex; align-items: center; gap: 18px; padding-block: 14px 18px; position: relative; z-index: 1; flex-wrap: wrap; }
.mon { width: 56px; height: 56px; flex: none; color: var(--noren-ink); }
.mon svg { display: block; width: 100%; height: 100%; }
.yago { min-width: 0; }
.yago-name { font-family: var(--f-brush); font-size: clamp(28px, 4vw, 40px); line-height: 1.05; letter-spacing: .06em; }
.yago-sub { font-size: 12px; letter-spacing: .12em; opacity: .78; }
.date { margin-left: auto; text-align: right; }
.era { font-family: var(--f-brush); font-size: clamp(22px, 3vw, 30px); line-height: 1.1; letter-spacing: .04em; }
.era .sea { display: inline-block; margin-left: .35em; padding: 0 .3em; border: 1.5px solid var(--noren-ink); border-radius: 3px; font-size: .8em; }
.ad { font-size: 12.5px; opacity: .85; letter-spacing: .04em; }

/* ---------- 帳場の帯 ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); border-bottom: 1px solid var(--line); }
.bar-in { display: flex; align-items: center; gap: 6px 18px; padding-block: 8px; flex-wrap: wrap; }
.stat { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.stat .k { font-size: 11px; color: var(--ink-3); letter-spacing: .08em; }
.stat .v { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat .v small { font-size: 11px; font-weight: 500; color: var(--ink-2); margin-left: 2px; }
.stats { display: flex; gap: 6px 20px; flex-wrap: wrap; align-items: center; min-width: 0; }
.go { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.timeline { height: 3px; background: var(--paper-2); position: relative; }
.timeline i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--kin); }

/* ---------- ボタン ---------- */
.btn { border: 1px solid var(--line); background: var(--paper); border-radius: var(--r); padding: 6px 12px; cursor: pointer; line-height: 1.3; white-space: nowrap; transition: background .15s, border-color .15s; }
.btn:hover:not(:disabled) { border-color: var(--ai); background: var(--ai-2); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.pri { background: var(--ai); color: var(--on-ai); border-color: var(--ai); font-weight: 700; }
.btn.pri:hover:not(:disabled) { filter: brightness(1.08); background: var(--ai); }
.btn.big { padding: 9px 18px; font-size: 15px; }
.btn.sm { padding: 3px 9px; font-size: 12.5px; }
.btn.warn { color: var(--shu); }
.btn.warn.armed { background: var(--shu); color: var(--paper); border-color: var(--shu); }
.btn.ghost { background: transparent; }
.linkish { align-self: flex-start; background: none; border: 0; padding: 0; color: var(--ai); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- 盤面 ---------- */
.board { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); gap: 18px; padding-block: 16px 40px; align-items: start; }
@media (max-width: 980px) { .board { grid-template-columns: minmax(0, 1fr); } }
.mapcard { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); }
@media (max-width: 980px) { .mapcard { position: static; } }
.maphead { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 4px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ai); color: var(--on-ai); }
.maphint { font-size: 12px; color: var(--ink-3); margin-left: auto; }
.mapbox { display: block; width: 100%; overflow: hidden; background: var(--land); }
.mapbox svg { display: block; width: 100%; height: auto; max-height: calc(100vh - 240px); overflow: visible; margin: 0 auto; }
@media (max-width: 980px) { .mapbox svg { max-height: 62vh; } }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; }
.lg-shoya { border-radius: 50%; background: var(--ai); }
.lg-v { border-radius: 50%; border: 1.5px solid var(--ink-3); background: var(--paper); }
.lg-town { border: 1.5px solid var(--ink); background: var(--paper); }
.lg-mine { background: var(--kin); border: 1.5px solid var(--ink); }
.lg-ring { border-radius: 50%; border: 2.5px solid var(--kin); }

/* 地図の中身 */
.m-land { fill: var(--land); }
.m-sea { fill: var(--sea); }
.m-lake { fill: var(--sea); stroke: var(--river); stroke-width: 1; }
.m-river { fill: none; stroke: var(--river); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.m-road { fill: none; stroke: var(--road); stroke-linecap: round; stroke-linejoin: round; }
.m-road.main { stroke-width: 2.6; stroke-dasharray: 8 5; opacity: .95; }
.m-road.local { stroke-width: 1.6; stroke-dasharray: 2 5; opacity: .9; }
.m-water { fill: none; stroke: var(--river); stroke-width: 2.2; stroke-dasharray: 10 6; stroke-linecap: round; opacity: .95; }
.m-roadname { fill: var(--road); font-size: 13.5px; font-weight: 700; letter-spacing: .08em; paint-order: stroke; stroke: var(--halo); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
.m-watername { fill: var(--river); font-size: 13.5px; font-weight: 700; letter-spacing: .08em; paint-order: stroke; stroke: var(--halo); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
.lg-line { width: 22px !important; height: 0 !important; border-top: 2.5px dashed var(--road); vertical-align: 3px !important; }
.lg-local { border-top: 2px dotted var(--road); }
.lg-water { border-top: 2.5px dashed var(--river); }
.m-seaname { fill: var(--river); font-family: var(--f-brush); font-size: 26px; letter-spacing: .3em; }
.m-areaname { fill: var(--ink-3); font-family: var(--f-brush); font-size: 22px; letter-spacing: .25em; opacity: .55; }
.m-label { fill: var(--ink); font-size: 15px; font-weight: 500; paint-order: stroke; stroke: var(--halo); stroke-width: 5px; stroke-linejoin: round; }
.m-tlabel { fill: var(--ink); font-family: var(--f-brush); font-size: 22px; paint-order: stroke; stroke: var(--halo); stroke-width: 6px; stroke-linejoin: round; }
.m-small { font-size: 12px; fill: var(--ink-2); }
.m-hit { cursor: pointer; }
.m-hit:focus { outline: none; }
.m-hit:focus-visible .m-sel, .m-hit:hover .m-sel { opacity: .6; }
.m-sel { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-dasharray: 4 3; opacity: 0; }
.m-hit.on .m-sel { opacity: 1; }
.m-v { fill: var(--paper); stroke: var(--ink-3); stroke-width: 1.6; }
.m-v.shoya { fill: var(--ai); stroke: var(--ai); }
.m-ring { fill: none; stroke: var(--kin); stroke-width: 3.5; stroke-linecap: round; }
.m-ringbg { fill: none; stroke: var(--land-2); stroke-width: 3.5; }
.m-home { fill: var(--noren); stroke: var(--kin); stroke-width: 2; }
.m-homebar { fill: var(--noren-ink); }
.m-t { fill: var(--paper); stroke: var(--ink); stroke-width: 1.8; }
.m-t.mine { fill: var(--kin); }
.m-tcount { fill: var(--paper); font-size: 13px; font-weight: 700; }
.m-t.closed { stroke-dasharray: 3 3; opacity: .5; }
.m-inset { fill: var(--paper-2); stroke: var(--ink-3); stroke-width: 1.2; }

/* ---------- 帳場(右) ---------- */
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs button { flex: 1 0 auto; border: 0; background: transparent; padding: 10px 14px 9px; cursor: pointer; font-family: var(--f-brush); font-size: 18px; color: var(--ink-2); border-bottom: 3px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--kin); }
.tabs button .badge { font-family: var(--f-body); font-size: 11px; background: var(--shu); color: var(--paper); border-radius: 9px; padding: 0 6px; margin-left: 4px; vertical-align: 3px; }
.pbody { padding: 14px 16px 20px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.sec { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.sec > h3 { margin: 0; font-family: var(--f-brush); font-weight: 400; font-size: 19px; letter-spacing: .06em; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.sec > h3 small { font-family: var(--f-body); font-size: 12px; color: var(--ink-3); letter-spacing: 0; }
.dhead { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.dhead h2 { margin: 0; font-family: var(--f-brush); font-weight: 400; font-size: 30px; line-height: 1.15; letter-spacing: .05em; }
.dhead .sub { font-size: 12.5px; color: var(--ink-2); }
.back { align-self: flex-start; }
.note { font-size: 13px; color: var(--ink-2); margin: 0; }
p { margin: 0; }

.ledger { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.ledger td { padding: 3px 0; border-bottom: 1px dotted var(--line); }
.ledger td:last-child { text-align: right; white-space: nowrap; }
.ledger tr.total td { border-bottom: 0; border-top: 1.5px solid var(--ink); font-weight: 700; padding-top: 6px; }

.rows { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 8px 6px; border-bottom: 1px solid var(--paper-2); cursor: pointer; text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; }
.row:hover { background: var(--paper-2); }
.row .t { font-weight: 700; min-width: 0; }
.row .t small { font-weight: 400; color: var(--ink-2); margin-left: 6px; }
.row .m { font-size: 12.5px; color: var(--ink-2); grid-column: 1; min-width: 0; }
.row .r { grid-row: 1 / span 2; grid-column: 2; text-align: right; font-variant-numeric: tabular-nums; }
.row .r small { display: block; font-size: 11.5px; color: var(--ink-3); }
.grouph { font-size: 12px; color: var(--ink-3); letter-spacing: .1em; padding: 10px 6px 2px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper-2); white-space: nowrap; }
.chip.ai { background: var(--ai); color: var(--on-ai); border-color: var(--ai); }
.chip.kin { background: var(--kin-2); color: var(--kin); border-color: transparent; }
.chip.bad { color: var(--shu); border-color: var(--shu); background: transparent; }
.chip.good { color: var(--moegi); border-color: var(--moegi); background: transparent; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.scale { display: inline-flex; gap: 2px; vertical-align: 1px; }
.scale i { width: 7px; height: 7px; border: 1.2px solid var(--kin); border-radius: 1px; }
.scale i.on { background: var(--kin); }

.meter { height: 8px; background: var(--paper-2); border-radius: 4px; position: relative; overflow: hidden; border: 1px solid var(--line); }
.meter > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ai); border-radius: 4px; }
.meter > i.pot { background: var(--ai-2); }
.meter.m10 { height: 10px; }
.meter.m10::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), var(--paper) calc(10% - 1px) 10%); pointer-events: none; }
.lvn { font-weight: 700; color: var(--ink); }
.meter > b { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--kin); }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; align-items: center; }
.kv .k { font-size: 12.5px; color: var(--ink-2); }

.grid-biz { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.bz { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 3px; background: var(--paper); min-width: 0; }
.bz.own { background: var(--kin-2); border-color: transparent; }
.bz .bn { font-weight: 700; display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
.bz .bn span { font-size: 11px; font-weight: 400; color: var(--ink-3); }
.bz .bd { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.bz .why { font-size: 11.5px; color: var(--ink-3); }
.bz .pay { font-size: 12px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.srow-h .sest .spay { display: block; font-size: 11px; font-weight: 400; color: var(--ink-3); text-align: right; }
.farbox { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding: 8px 12px; border-top: 1px solid var(--line); }
.farbox .farh { font-size: 12px; font-weight: 700; color: var(--ink-2); }
.farbox .fargrp { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.farbox .farg { font-size: 11.5px; color: var(--ink-3); }
.farbox .btn.far b { margin-left: 4px; font-size: 11px; padding: 0 5px; border-radius: 8px; background: var(--kin); color: var(--paper); }
.farbox .btn.far small { margin-left: 4px; font-size: 10.5px; color: var(--ink-3); }
.farbox .btn.far.on { outline: 2px solid var(--kin); outline-offset: 1px; }
.m-edge { cursor: pointer; font-weight: 700; }
.bz .btn { margin-top: 4px; align-self: flex-start; }

.cands { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.cand { border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 4px; }
.cand .nm { font-weight: 700; font-size: 15px; }
.cand .hs { font-size: 12px; color: var(--ink-2); }
.cand .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }

.alerts { display: flex; flex-direction: column; gap: 6px; }
.alert { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 8px 10px; border-radius: 8px; background: var(--paper-2); flex-wrap: wrap; }
.alert.warn { box-shadow: inset 3px 0 0 var(--shu); }
.alert.tip { box-shadow: inset 3px 0 0 var(--kin); }

.chart svg { width: 100%; height: auto; display: block; }
.c-grid { stroke: var(--line); stroke-width: 1; }
.c-area { fill: var(--kin-2); }
.c-line { fill: none; stroke: var(--kin); stroke-width: 2; }
.c-txt { fill: var(--ink-3); font-size: 11px; }
.c-dot { fill: var(--kin); }

.chron { display: flex; flex-direction: column; gap: 12px; font-family: var(--f-hand); }
.chron .yr { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 10px; }
.chron .yh { font-family: var(--f-brush); font-size: 17px; line-height: 1.25; color: var(--ink); }
.chron .yh small { display: block; font-family: var(--f-body); font-size: 11px; color: var(--ink-3); }
.chron ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.chron li { font-size: 14px; line-height: 1.55; }
.chron li .sn { display: inline-block; width: 1.3em; color: var(--ink-3); font-size: 12px; }
.chron li.ev { font-weight: 600; }
.chron li.bad, .chron li.death { color: var(--shu); }
.chron li.good, .chron li.birth { color: var(--moegi); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button[aria-pressed="true"] { background: var(--ai); color: var(--on-ai); border-color: var(--ai); }

select.sel { max-width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: var(--r); padding: 5px 8px; }
.inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.switch { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; font-size: 13px; }

/* ---------- 御触書(イベント) ---------- */

function villageOrder() {
  const RK = [['上', '中', '下'], ['奥', '中', '口'], ['北', '東', '中', '西', '南'], ['大', '中', '小']];
  const affix = (n) => {
    if (n.length < 3) return null;
    const AF = '上中下奥口北東西南大小';
    if (AF.includes(n[0])) return [n.slice(1), n[0]];
    if (AF.includes(n[n.length - 1])) return [n.slice(0, -1), n[n.length - 1]];
    return null;
  };
  const out = [];
  for (const area of AREAS) {
    let ids = Object.keys(VILLAGES).filter(id => VILLAGES[id].area === area);
    const fix = AREA_FIX[area];
    if (fix) {
      const order = fix.split(' ');
      const pos = (id) => { const i = order.indexOf(VILLAGES[id].n); return i < 0 ? 999 : i; };
      ids = ids.map((id, i) => [id, i]).sort((a, b) => (pos(a[0]) - pos(b[0])) || a[1] - b[1]).map(x => x[0]);
    } else if (fix !== null) {
      const grp = {};
      for (const id of ids) { const k = affix(VILLAGES[id].n); if (k) (grp[k[0]] = grp[k[0]] || []).push([id, k[1]]); }
      const rankIn = (g) => { const cs = g.map(x => x[1]); const sc = RK.find(r => cs.every(c => r.includes(c))) || RK[0]; return (c) => { const i = sc.indexOf(c); return i < 0 ? 99 : i; }; };
      const done = new Set(), res = [];
      for (const id of ids) {
        if (done.has(id)) continue;
        const k = affix(VILLAGES[id].n), g = k && grp[k[0]];
        if (g && g.length >= 2) { const rk = rankIn(g); for (const [x] of g.slice().sort((p, q) => rk(p[1]) - rk(q[1]))) { res.push(x); done.add(x); } }
        else { res.push(id); done.add(id); }
      }
      ids = res;
    }

function uniqueName(s, sex, child) {
  const used = new Set(s.people.filter(p => p.alive).map(p => p.name));
  for (let i = 0; i < 40; i++) {
    let n;
    if (sex === 'F') n = pick(s, F_NAMES);
    else if (child) n = pick(s, C_PRE) + pick(s, C_SUF);
    else n = pick(s, M_PRE) + pick(s, M_SUF);
    if (n[0] === n[1] || n === '吉吉') continue;
    if (!used.has(n)) return n;
  }
  return sex === 'F' ? pick(s, F_NAMES) : pick(s, M_PRE) + pick(s, M_SUF);
}

let MAIN_ROAD_IDS = null;

}

function extraTick(s) {

/* ---------- 金貸し(田地を質に取る) ---------- */
const LOAN_RATE = .15, LOAN_TERM = 5;
function loanPrincipal(s, n) { return Math.round(n * landPriceBase(s) * .6); }
function loanRoom(s, id) {
  const v = s.villages[id];
  return Math.max(0, Math.min(Math.floor(kokuOf(s, id) * .2) - pledged(s, id), holdMax(s, id) - v.owned - pledged(s, id)));
}
function canLend(s, id, n) {
  if (influence(s, id) < 10) return { ok: false, why: '村に顔が利かない(影響力10から)' };
  if (n > loanRoom(s, id)) return { ok: false, why: '質に取れる田地がもうない' };
  const amt = loanPrincipal(s, n);
  if (!canSpend(s, amt)) return { ok: false, why: '貸す銭が足りない' };
  return { ok: true, amt };
}
function lend(s, id, n, quiet) {
  const c = canLend(s, id, n);
  if (!c.ok) return c;
  s.loans = s.loans || [];
  s.money -= c.amt;
  s.loans.push({ id: (s.nextLoan = (s.nextLoan || 0) + 1), vid: id, n, principal: c.amt, start: s.year, due: s.year + LOAN_TERM, miss: 0 });
  const v = s.villages[id]; v.goodwill = Math.min(100, v.goodwill + Math.max(1, n / 10));
  if (!quiet) log(s, `${vName(id)}の百姓に田地${n}石を質に取って${fmtMoney(s, c.amt)}を貸す(年一割五分・${LOAN_TERM}年季)。`, 'mura');
  return { ok: true, amt: c.amt };
  return { ok: true };
}
function harvestAt(s, id, h) { const k = s.villages[id].kangai || 0; return h < 1 ? 1 - (1 - h) * (1 - .25 * k) : h; }
/* 秋の取り入れのあと:利息を受け取り、年季が明けた質地は請け戻すか流れる */
function loanTick(s) {
  let interest = 0;
  const keep = [];
  for (const l of (s.loans || [])) {
    const v = s.villages[l.vid];
    const hv = harvestAt(s, l.vid, s.harvest);
    const payP = clamp(.93 - (1 - hv) * 2.4 - (v.goodwill < 20 ? .08 : 0), .12, .97);
    if (rnd(s) < payP) interest += l.principal * LOAN_RATE; else l.miss++;
    const done = s.year >= l.due || l.miss >= 3;
    if (!done) { keep.push(l); continue; }
    const back = clamp(.62 - .22 * l.miss + (hv - 1) * 1.5, .05, .9);
    if (l.miss < 3 && rnd(s) < back) {
      s.money += l.principal;
      v.goodwill = Math.min(100, v.goodwill + 1);
      log(s, `${vName(l.vid)}の質地${l.n}石が元金${fmtMoney(s, l.principal)}で請け戻される。`, 'mura');
    } else {
      const n = Math.max(0, Math.min(l.n, holdMax(s, l.vid) - v.owned));
      v.owned += n;
      v.goodwill = Math.max(0, v.goodwill - 2 * Math.max(1, l.n / 10));
      log(s, `${vName(l.vid)}の質地${n}石が質流れとなり、${s.yago}の持高に入る。`, 'mura');
      checkShoya(s, l.vid);
    }
  }
  s.loans = keep;
  return interest;
}

const DEV = {

const KANGAI_NAMES = ['用水路を開く', '溜池を掘る', '井堰と堤を築く', '水門を設ける', '用水を引き延ばす', '大溜池を築く', '分水の堰を設ける', '暗渠と悪水抜きを掘る', '大井堰を築く', '用水を村々に巡らす'];

const KANTAKU_MAX = { lake: 1500, sea: 1000, marsh: 600 };
function devRoom(s, id, k) {
  const d = VILLAGES[id], v = s.villages[id];
  const doing = (v.proj || []).filter(x => x.k === k).reduce((a, x) => a + x.n, 0);
  if (k === 'kaikon') return Math.max(0, Math.floor(d.koku * 1.0 / 10) * 10 - (v.kaikon || 0) - doing);

  return Math.max(0, (KANTAKU_MAX[d.shore] || 600) - (v.kantaku || 0) - doing);
}
function devCost(s, id, k, n) {
  const d = VILLAGES[id];
  const hilly = d.prod.includes('炭') || d.prod.includes('木材');
  return Math.round(n * DEV[k].per * (k === 'kaikon' && hilly ? 1.3 : 1) * P(s.year));
}
function canDevelop(s, id, k, n) {

  if (k === 'kantaku' && !VILLAGES[id].shore) return { ok: false, why: '沼・池・湖・湿地・海のある村でないと干拓はできない' };
  if (n > devRoom(s, id, k)) return { ok: false, why: k === 'kaikon' ? '拓ける土地がもうない' : '締め切れる水面がもうない' };
  if (v.owned + pledged(s, id) + n > holdMax(s, id) + n * .6) return { ok: false, why: '持高がもう多すぎる' };

  return { ok: true, cost };
}
function develop(s, id, k, n, quiet) {
  const c = canDevelop(s, id, k, n);

/* ---------- 一季を進める ---------- */
function livingCost(s) {

function advance(s) {

  migrate(s);

  if (s.autoTrain) bulkTrain(s);

  if (s.autoGift != null && honganReady(s).gift) honganGift(s, s.autoGift);
  teigakuTick(s);
  const m0 = s.money;
  const ctx = buildCtx(s);
  const L = { store: 0, village: 0, extra: 0, kashi: 0, salary: 0, living: 0, norimono: 0, edu: 0, interest: 0, other: 0 };
  for (const st of s.stores) {

    if (st.mgr != null) { const m = person(s, st.mgr); if (!m || !canWork(s, m)) st.mgr = null; }

    if (st.bigOrder) { v *= 1.6; st.bigOrder = false; }

    s.harvest = h;

    const word = h < .7 ? '大凶作' : h < .85 ? '凶作' : h < .95 ? '不作' : h < 1.06 ? '平年作' : '豊作';
    log(s, `秋の取り入れは${word}。米一石${ricePriceText(s)}。`, h < .85 ? 'bad' : h > 1.06 ? 'good' : '');

  lifeEvents(s);
  villageTick(s);
  randomEvents(s, ctx);
  if (s.money < -credit(s) * 1.2 && s.stores.length) {
    const st = s.stores.slice().sort((a, b) => (a.last || 0) - (b.last || 0))[0];
    const back = Math.round(st.invest * .4);
    s.money += back;
    s.stores = s.stores.filter(x => x !== st);
    log(s, `借財がかさみ、${locName(s, st.loc)}の${BIZ[st.type].shop}を手放す(${fmtMoney(s, back)})。`, 'bad');
  } else if (s.money < -credit(s) * 1.2) {

    s.fame = Math.max(0, s.fame - 15);

    s.queue.push({ k: 'news', t: '身代限り', b: '借財が返せる見込みを超えた。平屋の田地の一部を残して家財を処分し、債権者と示談した。番頭たちには暇を出した。家の名は地に落ちたが、一族はまだ残っている。ここから立て直すしかない。', extra: [] });

  }

}

function die(s, p, cause) {
  p.alive = false; p.death = s.year;
  unassign(s, p.id);
  const rel = relation(s, p);
  log(s, `${rel}${p.name}、${cause ? cause + (/[くし]$/.test(cause) ? '、' : 'により') : ''}${ageOf(s, p) < 1 ? '生まれて間もなく' : '享年' + ageOf(s, p) + 'にて'}世を去る。`, 'death');
  if (p.id === s.headId && p.id !== s.heroId) {
    s.headId = s.heroId;
    s.queue.push({ k: 'succession', old: p.id });
  }
}
function fert(a) { return a < 14 ? 0 : a < 16 ? .18 : a < 25 ? .27 : a < 30 ? .25 : a < 35 ? .2 : a < 40 ? .13 : a <= 45 ? .06 : 0; }
function lifeEvents(s) {
  const t = turnOf(s);
  const epi = (s.flags.epi && s.flags.epi.until >= t) ? s.flags.epi.mult : 1;
  for (const p of s.people.slice()) {
    if (!isActive(s, p) || p.hero) continue;
    const a = ageOf(s, p);
    if (p.fate != null) { if (a >= p.fate && (s.season === 3 || rnd(s) < .3)) die(s, p, '天寿を全うし'); continue; }
    let q = a < 5 ? .05 : a < 15 ? .01 : .003 * Math.exp(.08 * (a - 30));
    q = Math.min(.6, q) * epi;
    if (rnd(s) < q / 4) die(s, p, epi > 1 && rnd(s) < .6 ? '流行り病' : '');
  }
  for (const m of s.people.slice()) {
    if (m.sex !== 'F' || !m.alive || !m.inHouse || m.banto) continue;
    const f = person(s, m.spouse);
    if (!f || !f.alive || !(f.inHouse || f.hero)) continue;
    const a = ageOf(s, m);
    const kids = s.people.filter(c => c.parents.includes(m.id)).length;
    if (kids >= 10) continue;
    const ch = fert(a) * Math.max(.3, 1 - kids * .08);
    if (rnd(s) < ch / 4) { newborn(s, m, f); if (rnd(s) < .015 && m.fate == null) die(s, m, '産後の肥立ちが悪く'); }
  }
}
function newborn(s, mo, fa) {

  const pot = Math.round(clamp((fa.pot + mo.pot) / 2 + gauss(s) * 12, 20, 96));
  const cpot = Math.round(clamp((fa.cpot + mo.cpot) / 2 + gauss(s) * 12, 20, 95));
  const c = mkPerson(s, { name: uniqueName(s, sex, true), sex, birth: s.year, skill: 0, pot, charm: 0, cpot, parents: [fa.id, mo.id], child: sex === 'M', fate: 111 + Math.floor(rnd(s) * 10) });
  const rel = relation(s, c);

}
/* ---------- 仕事と稽古による成長 ---------- */
function growthFactor(v, pot) { return clamp((pot + 8 - v) / 20, .03, 1); }

    p[key] = Math.min(99, p[key] + w);
    p[acc] -= w;
    p.gain = p.gain || { skill: 0, charm: 0 };
    p.gain[key] += w;
  }
}
function workRates(s, p) {

  let charm = j.villages.length ? Math.min(1.25, .5 + .25 * j.villages.length) : (j.stores.length ? .15 : .1);
  if (p.id === s.headId) charm += .3;

}
function workGrowth(s) {
  for (const p of s.people) {

    if (ageOf(s, p) < 15 && !(p.post != null && p.rank)) continue;
    const r = workRates(s, p);

    addStat(p, 'charm', r.charm);
  }
}
function trainCost(s) {

}
function canTrain(s, p, k) {

  if (p.banto && !t.banto) return { ok: false, why: '番頭には向かない' };
  const a = ageOf(s, p);
  if (a < t.min || a > t.max) return { ok: false, why: `${t.min}歳から${t.max}歳まで` };

function startTraining(s, pid, k) {

  const t = TRAIN[k];

  log(s, `${relation(s, p)}${p.name}、${t.where}${t.n.replace(/^京の大店へ/, '')}をはじめる。`, 'kazoku');

function learnMult(a) { return a <= 10 ? 2 : a <= 20 ? 1.5 : 1.25; }

function villageTick(s) {

function damage(s, st, heavy) {

      if (a >= 66) { unassign(s, p.id); p.retired = true; log(s, `${rk}${p.name}、${a}歳で隠居する。長年の奉公をねぎらう。`, 'kazoku'); continue; }

      if (!p.rank && y - p.joined >= 12 && p.skill >= 55 && !p.askedNoren && rnd(s) < .15) { p.askedNoren = true; s.queue.push({ k: 'noren', pid: p.id }); }
    }
  }
  for (const id of VILLAGE_ORDER) {
    const v = s.villages[id];
    if (!VILLAGES[id].home) v.goodwill *= .92;
  }
  const hero = person(s, s.heroId);
  const ha = ageOf(s, hero);
  const shoyaN = VILLAGE_ORDER.filter(id => s.villages[id].shoya).length;
  const bigN = s.stores.filter(st => st.scale >= 4).length;
  addFame(s, Math.min(1.5, (shoyaN - 1) * .05) + Math.min(1, bigN * .05));
  const th = [3000, 10000, 50000, 300000, 2000000];
  const a = assets(s);
  while (s.milestones < th.length && a >= th[s.milestones] * Math.pow(P(y), .5)) {
    s.milestones++; addFame(s, 3);
    log(s, `身代が${fmtMoney(s, th[s.milestones - 1])}を超え、${['村一番の物持ち', '丹波一円に名の知れた分限者', '京大坂でも指折りの商家', '天下に聞こえた豪商', '比べる者のない大身代'][s.milestones - 1]}と噂される。`, 'good');
  }
  checkHongan(s);
  honganYear(s);
  if (s.fame >= 40 && !s.flags.myoji) { s.flags.myoji = true; s.queue.push({ k: 'myoji' }); }
  if (s.fame >= 60 && !s.flags.goyo) { s.flags.goyo = true; s.queue.push({ k: 'goyo' }); }
  const jubilee = { 61: '還暦', 70: '古希', 77: '喜寿', 80: '傘寿', 88: '米寿', 90: '卒寿', 99: '白寿', 108: '茶寿', 111: '皇寿', 120: '大還暦' };
  if (jubilee[ha]) { addFame(s, (ha >= 88 ? 3 : 1)); log(s, `${hero.name}、${kanji(ha)}歳の${jubilee[ha]}を迎え、一族そろって祝う。`, 'good'); }
  if (ha === 100) s.queue.push({ k: 'hyakusai' });
  genHirePool(s);
  if (rnd(s) < .06) {
    const c = s.hirePool[0];
    c.skill = Math.min(92, c.skill + 18); c.pot = Math.min(95, c.skill + 8); c.salary = Math.round(3 + c.skill * .15 + c.charm * .05);
    log(s, `腕の立つ奉公人${c.name}が、${s.yago}で働きたいと訪ねてくる(雇い入れ候補)。`, 'good');
  }
  if (s.flags.epi && s.flags.epi.until < turnOf(s)) delete s.flags.epi;
  for (const k in s.booms) if (s.booms[k].until < turnOf(s)) delete s.booms[k];
  for (const p of [...family(s), ...bantos(s)]) if (TRAIN_AGES.includes(ageOf(s, p))) askTrain(s, p);
  enTick(s);
  if (!s.autoAll && !s.noAutoAsk && assignGaps(s).total > 0) s.queue.push({ k: 'autoAsk' });
}

function histEvents(s) {
  const ik = [];
  for (const h of HIST) if (h.y === s.year && h.s === s.season) { if (h.k === 'ikki') ik.push(h); else applyHist(s, h); }
  if (ik.length) applyIkki(s, ik);
}
/* 同じ季の一揆・騒動はまとめて一つの知らせにする。村の信が下がり、当家が庄屋の村があれば施米するか選ぶ */
function applyIkki(s, list) {
  const lines = [], mine = new Set(), towns = new Set();
  let maxLoss = 0;
  for (const h of list) {
    let n = 0;
    for (const id of Object.keys(VILLAGES)) {
      const v = s.villages[id];
      if (!v || !h.areas.includes(VILLAGES[id].area)) continue;
      if (v.shoya) { mine.add(id); continue; }
      /* 一揆の通り道や騒動の起きた村(vills)は、ほかの倍下がる */
      const ls = h.vills && h.vills.includes(id) ? h.loss * 2 : h.loss;
      if (v.goodwill > 0) { v.goodwill = Math.max(0, v.goodwill - ls); n++; }
    }
    maxLoss = Math.max(maxLoss, h.loss);
    for (const t of h.towns || []) towns.add(t);
    lines.push(`【${h.t}】${h.b}${n ? `(${n}村で村方の信が下がる)` : ''}`);
    log(s, `${h.t}。`, 'ev');
  }
  const t = list.length === 1 ? list[0].t : `各地の一揆・騒動(${list.length}件)`;
  const b = lines.join('\n\n');
  const hit = s.stores.some(x => towns.has(x.loc) && x.type === 'beikoku');
  if (hit) s.queue.push({ k: 'uchikowashi', t, b, locs: [...towns] });
  if (mine.size) s.queue.push({ k: 'ikki', t, b: hit ? '' : b, ids: [...mine], loss: maxLoss });
  if (!hit && !mine.size) s.queue.push({ k: 'news', t, b, extra: [] });
}
function applyHist(s, h) {
  const P0 = P(s.year);
  const t = turnOf(s);
  let extra = [];
  if (h.k === 'fire' || h.k === 'oshio') {
    for (const st of s.stores.filter(x => x.loc === h.loc)) {
      if (rnd(s) < h.p) { const d = damage(s, st, h.heavy); extra.push(`${BIZ[st.type].shop}が焼け${d ? '、' + SCALE_NAMES[st.scale] + 'に縮んだ' : 'た'}`); }
    }
    s.booms[h.loc + ':zaimoku'] = { until: t + 8, mult: 1.6 };
    s.booms['*:zaimoku'] = { until: t + 4, mult: 1.15 };
    extra.push('焼け跡の普請で材木の値が上がる');
    if (h.k === 'oshio') s.riceRel = Math.max(s.riceRel, 1.4);
  }
  if (h.k === 'quake') {
    for (const [loc, p] of Object.entries(h.locs)) {
      for (const st of s.stores.filter(x => x.loc === loc)) if (rnd(s) < p) { const d = damage(s, st, true); extra.push(`${townName(s, loc)}の${BIZ[st.type].shop}が崩れ${d ? '、' + SCALE_NAMES[st.scale] + 'に縮んだ' : 'た'}`); }
      s.booms[loc + ':zaimoku'] = { until: t + 8, mult: 1.6 };
    }
  }
  if (h.k === 'epidemic') { s.flags.epi = { until: t + h.len, mult: h.mult }; }
  if (h.k === 'boom') { for (const [ty, m] of Object.entries(h.boom)) s.booms['*:' + ty] = { until: t + h.len, mult: m }; }
  if (h.k === 'kien') {
    let loss = 0;
    for (const st of s.stores.filter(x => x.type === 'ryogae')) loss += st.scale * 40;
    if (loss) { s.money -= loss; extra.push(`貸付の焦げ付きで${fmtMoney(s, loss)}の損`); }
  }
  if (h.k === 'haihan') {
    let loss = 0;
    for (const st of s.stores.filter(x => x.type === 'ryogae')) loss += st.scale * 30 * P0;
    loss += Math.max(0, s.money) * .02;
    loss = Math.round(loss);
    s.money -= loss;
    extra.push(`藩札の引き替えで${fmtMoney(s, loss)}の損`);
  }
  if (h.k === 'uchikowashi') {
    const hit = s.stores.filter(x => h.locs.includes(x.loc) && x.type === 'beikoku');
    if (hit.length) { s.queue.push({ k: 'uchikowashi', t: h.t, b: h.b, locs: h.locs }); log(s, `${h.t}。`, 'ev'); return; }
  }
  if (h.k === 'goyokin') {
    if (s.money > 150) { const amt = Math.round(Math.max(30 * P0, s.money * h.rate)); s.queue.push({ k: 'goyokin', who: h.who, amt, t: h.t, b: h.b }); log(s, `${h.t}。`, 'ev'); return; }
    extra.push('蔵が乏しいとみて、沙汰は来なかった');
  }
  if (h.k === 'yamaguni') {
    const v = s.villages.yamaguni;
    if (v.shoya || v.goodwill >= 15 || v.owned > 0) { s.queue.push({ k: 'yamaguni' }); log(s, `${h.t}。`, 'ev'); return; }
    return;
  }
  log(s, `${h.t}。${extra.length ? extra.join('。') + '。' : ''}`, 'ev');
  s.queue.push({ k: 'news', t: h.t, b: h.b, extra });
}

      if (!p || !marriageable(s, p) || !c) return 'この縁談はもう流れた。';
      const lines = c.list.map((x, i) => `${'一二三'[i]}. ${candLine(s, x)}  (${x.house})`);
      const ms = wedModes(s, p);
      const how = ms.length === 1 ? `【${wedLabel(p, 'in')}】を選ぶと、相手が${p.sex === 'M' ? '嫁' : '婿'}として当家に入る。` : `【${wedLabel(p, 'in')}】は相手が当家に入り、【${wedLabel(p, 'out')}】は${p.name}が相手の家へ行って家を出る。`;
      return `${p.name}(${ageOf(s, p)}歳)に、縁談が${c.list.length}つ持ち込まれた。\n\n${lines.join('\n')}\n\n${how}${houseFullFor(s, p) && ms.includes('in') ? '\n屋敷がいっぱいで、いまは迎えられない。' : ''}`;
    },
    choices: (s, q) => {
      const p = person(s, q.pid), c = s.cands[q.pid];
      const out = [];
      if (p && marriageable(s, p) && c) {
        const full = houseFullFor(s, p), tr = trousseau(s);
        const ms = wedModes(s, p);
        c.list.forEach((x, i) => {
          if (ms.includes('in') && !full) out.push({ label: `【${wedLabel(p, 'in')}】${candLine(s, x)}`, note: `${x.name}が${p.sex === 'M' ? '嫁' : '婿'}として当家に入る(${x.house})`, act: () => wed(s, p.id, i, 'in') });
          if (ms.includes('out') && canSpend(s, tr)) out.push({ label: `【${wedLabel(p, 'out')}】${candLine(s, x).replace(/ 持参金.*$/, '')}`, note: `${p.name}が${x.house}へ${p.sex === 'F' ? '嫁入り' : '婿入り'}して家を出る(支度金${fmtMoney(s, tr)})`, act: () => wed(s, p.id, i, 'out') });
        });
      }
      out.push({ label: '今回は見送る', note: '二年ほどでまた縁談が来る。人の頁からいつでも探せる', act: () => {} });
      out.push({ label: 'これからは縁談の知らせを出さない', note: '帳場の「まとめて指図」で元に戻せる', act: () => { s.noEnAsk = true; } });
      return out;
    },
  },

function scaleDots(n, max) { max = max || 5; let s = '<span class="scale" aria-label="' + E.SCALE_NAMES[n] + '">'; for (let i = 1; i <= max; i++) s += `<i class="${i <= n ? 'on' : ''}${i > 5 ? ' big' : ''}"></i>`; return s + '</span>'; }
function storeName(st) { return `${E.locName(S, st.loc)} ${E.BIZ[st.type].shop}`; }

const LV = (v) => E.LV(v);

function meter10(v, pot) { return `<div class="meter m10" title="${LV(v)}段(素質${LV(pot)}段)"><i class="pot" style="width:${Math.min(100, LV(pot) * 10)}%"></i><i style="width:${Math.min(100, v)}%"></i></div>`; }

function groupLocs(stores) {

/* 手空き:六歳以上で、役目も奉公も稽古もない者(手習いに通う子は除く) */
function isIdleP(p) {
  const a = age(p);
  if (a < 6 || !E.isActive(S, p) || E.isAway(p) || p.train) return false;
  if (!p.banto && S.school && a >= 7 && a <= 14) return false;
  return E.isIdle(S, p.id);
}
function jobSummary(p) {
  if (E.isAway(p)) return `修業奉公で京に出ている(あと${p.train.left}季)`;
  const j = E.jobsOf(S, p.id);
  const parts = [];
  if (p.post != null && p.rank) { const st = S.stores.find((x) => x.id === p.post); if (st) parts.push(`${E.RANK[p.rank].n}(${storeName(st)})`); }
  else if (p.banto && p.rank) parts.push('奉公先なし');
  if (j.villages.length) parts.push(`村 ${j.villages.map((v) => E.VILLAGES[v].n).join('・')}`);
  if (!parts.length) parts.push(age(p) < 6 ? '幼子' : (!p.banto && S.school && age(p) >= 7 && age(p) <= 14 ? '手習い' : '手空き'));
  if (p.train) parts.push(`稽古:${E.TRAIN[p.train.k].n.replace(/の稽古|に通う/, '')}(あと${p.train.left}季)`);
  return parts.join(' / ');
}
function capText(p) {

/* 店に就けられる者(いまの差配を含む) */
let MGR_INDEX = null;
function storeMgrOptions(st) {
  const byMgr = MGR_INDEX || E.storesByMgr(S);
  const ws = E.workers(S).slice().sort((a, b) => b.skill - a.skill);
  const td = E.staffAt(S, st.id).filter((q) => q.rank === 'tedai').sort((a, b) => b.skill - a.skill)[0];
  const opts = [`<option value="">${td ? `— 手代${esc(td.name)}に任せる(商才${LV(td.skill)}段・目配り七割五分) —` : '— 差配なし(売上およそ半分) —'}</option>`];
  let blocked = 0;
  for (const p of ws) {
    const cur = p.id === st.mgr;
    const ok = cur || E.canManageStore(S, p.id, st.loc, st.id, byMgr).ok;
    if (!ok) { blocked++; continue; }
    opts.push(`<option value="${p.id}" ${cur ? 'selected' : ''}>${esc(p.name)}(商才${LV(p.skill)}段・受け持ち${E.mgrUnits(byMgr[p.id] || [])}/${E.storeCap(p)})${p.post != null ? '・奉公を解く' : ''}</option>`);
  }

}
function villageMgrOptions(vid) {
  const v = S.villages[vid];

  const opts = ['<option value="">— 置かない —</option>'];
  for (const p of ws) {
    const cur = p.id === v.mgr;

/* 平屋からの道のりと時間 */
function hoursText(h) { const n = Math.max(.5, Math.round(h * 2) / 2), w = Math.floor(n); return w ? `約${w}時間${n % 1 ? '半' : ''}` : '約30分'; }
function riText(ri) { const n = Math.round(ri * 2) / 2, w = Math.floor(n); return `約${w}里${n % 1 ? '半' : ''}`; }
function clockText(t) { const hh = Math.round(t * 2) / 2, w = Math.floor(hh), half = hh % 1 ? '半' : ''; return w < 12 ? `朝${w}時${half}` : w === 12 ? `昼12時${half}` : `午後${w - 12}時${half}`; }
function arriveText(h) {
  if (E.sameDay(h)) return `朝6時に発てば${clockText(6 + E.elapsedOf(h))}ごろ着`;
  const days = Math.ceil(h / E.DAY_TRAVEL_H), rem = h - (days - 1) * E.DAY_TRAVEL_H;
  return `途中${days - 1}泊、${days}日目の${clockText(6 + E.elapsedOf(rem))}ごろ着`;
}
function travelLine(loc) {

  const wb = w && w.boats.length && w.boats.map((b) => b.boat).join() !== k.boats.map((b) => b.boat).join() ? `(${w.boats.map((b) => b.boat).join('・')}を使う)` : '';
  return `<div class="travel"><span class="k">平屋から</span><span>駕籠で${hoursText(k.h)}(${arriveText(k.h)})${boats.length ? '。途中、' + boats.join('、') + 'に乗る' : ''}</span>
    <span class="k"></span><span>徒歩で${hoursText(w.h)}${wb}${k.ri >= .5 ? ` · 陸の道のり${riText(k.ri)}` : ''}</span></div>`;
}

  if (wed.length) out.push({ cls: 'tip', html: `縁談の年頃の者が${wed.length}人(${wed.slice(0, 4).map((p) => esc(p.name)).join('・')}${wed.length > 4 ? 'ほか' : ''})。`, btn: `<button class="btn sm" data-act="wedAll">縁談を見る</button>` });

function assetChart() {
  const h = S.hist;
  if (h.length < 2) return `<p class="note">年が明けるごとに身代を書き留める。</p>`;
  const W = 600, H = 170, padL = 44, padB = 22, padT = 8;
  const vals = h.map((r) => Math.max(10, r.assets));
  const lo = Math.pow(10, Math.floor(Math.log10(Math.min(...vals))));
  const hi = Math.pow(10, Math.ceil(Math.log10(Math.max(...vals) * 1.01)));
  const x = (y) => padL + (y - E.START_YEAR) / (E.END_YEAR - E.START_YEAR) * (W - padL - 8);
  const yv = (v) => padT + (1 - (Math.log10(v) - Math.log10(lo)) / (Math.log10(hi) - Math.log10(lo))) * (H - padT - padB);
  const lab = (v) => v >= 1e8 ? (v / 1e8) + '億' : v >= 1e4 ? (v / 1e4).toLocaleString('ja-JP') + '万' : v.toLocaleString('ja-JP');
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="身代の推移(対数目盛)">`;
  for (let v = lo; v <= hi; v *= 10) s += `<line class="c-grid" x1="${padL}" x2="${W - 8}" y1="${yv(v)}" y2="${yv(v)}"/><text class="c-txt" x="${padL - 6}" y="${yv(v) + 4}" text-anchor="end">${lab(v)}</text>`;
  for (const yy of [1770, 1800, 1830, 1860]) s += `<text class="c-txt" x="${x(yy)}" y="${H - 5}" text-anchor="middle">${yy}</text>`;
  const pts = h.map((r) => `${x(r.y).toFixed(1)},${yv(Math.max(lo, Math.max(10, r.assets))).toFixed(1)}`);
  s += `<polygon class="c-area" points="${x(h[0].y).toFixed(1)},${H - padB} ${pts.join(' ')} ${x(h[h.length - 1].y).toFixed(1)},${H - padB}"/>`;
  s += `<polyline class="c-line" points="${pts.join(' ')}"/>`;
  const last = h[h.length - 1];
  s += `<circle class="c-dot" cx="${x(last.y)}" cy="${yv(Math.max(lo, Math.max(10, last.assets)))}" r="3.5"/>`;
  return s + '</svg>';
}

function payYears(cost, gain) {
  if (!(gain > 0)) return '回収の見込みなし';
  const y = cost / gain;
  return '約' + (y < 10 ? y.toFixed(1) : Math.round(y)) + '年で回収';
}
/* 回収の順:mode 1 = 一段広げる元手が何年で戻るか、mode 2 = これまでの元手が何年で戻るか。再建中はいちばん下 */
function sortedByPay(ctx, mode) {
  const key = new Map();
  for (const st of S.stores) {
    if (st.closed > 0) { key.set(st, [2, 0]); continue; }
    const est = E.storeAnnual(S, st, ctx);
    if (mode === 1) {
      if (st.scale < E.maxScale(S, st)) {
        const nx = E.storeAnnual(S, Object.assign({}, st, { scale: st.scale + 1 }), ctx, { ignoreClosed: true });
        const g = nx - est;
        key.set(st, [0, g > 0 ? E.upgradeCost(S, st) / g : 1e9]);
      } else key.set(st, [1, est > 0 ? st.invest / est : 1e9]);
    } else key.set(st, [0, est > 0 ? st.invest / est : 1e9]);
  }
  return [...S.stores].sort((a, b) => { const x = key.get(a), y = key.get(b); return x[0] - y[0] || x[1] - y[1]; });
}

    butsu: (lv) => `本願寺への寄進とお勤めの積み重ね+${3 * (lv - 1)}%。十段で持仏堂、十七段で母屋から離れた仏蔵が建つ。本邸を移すと一緒に移る。`,
    hanare: (lv) => `屋敷に住める人数+${2 * lv}人。普請のたびに家格が少し上がる。`,

    kura: (lv, loc) => `${loc}の店の売上+${(lv * .5).toFixed(1)}%。借りられる額が増える。`,
    niwa: (lv, loc) => `一族の人望の伸び+${lv}%。普請のたびに家格が上がる${loc === '京' ? '(京の庭はひときわ)' : ''}。`,

function estateRow(which, k, vi) {

    <div class="est-h"><b>${E.ESTATE_KIND[k].n}</b><span class="est-lv num">${lv}<small>/${MX}段</small></span><span class="note">${esc(E.estateStep(k, lv) || 'まだない')}</span></div>

      <div class="ests">${estateRow('villa', 'yashiki')}</div>` : '<p class="note">別邸を構えられる町がもうない(京・平屋か、店のある町に一邸ずつ)。</p>'}

    <p class="note">屋敷・蔵・庭・仏間は二十段、離れ・茶室は十段まで。段が上がるほど普請の銭はかさむ。普請に掛けた銭の半分は身代に数える。本邸も別邸も売れる(住まいは一つは要る)。別邸へ移り住めば、そこが本邸になる。</p>

/* =====================================================================

const LOG_FILTERS = [['all', 'すべて'], ['ev', '世の中'], ['biz', '商い'], ['mura', '村方'], ['kazoku', '一族'], ['bad', '災難']];
function viewNendaiki() {
  const f = UI.logFilter;
  const ok = (l) => f === 'all' || (f === 'kazoku' ? ['kazoku', 'birth', 'death'].includes(l.cls) : f === 'bad' ? l.cls === 'bad' || l.cls === 'death' : l.cls === f);
  const by = new Map();
  for (const l of S.log) { if (!ok(l)) continue; if (!by.has(l.y)) by.set(l.y, []); by.get(l.y).push(l); }
  const years = [...by.keys()].sort((a, b) => b - a).slice(0, 60);
  return `
    <div class="filters">${LOG_FILTERS.map(([k, n]) => `<button class="btn sm" data-act="logf" data-f="${k}" aria-pressed="${f === k}">${n}</button>`).join('')}</div>
    <div class="chron">${years.map((y) => `<div class="yr"><div class="yh">${E.eraOf(y).text}<small>${y}</small></div><ul>${by.get(y).slice().reverse().map((l) => `<li class="${l.cls}"><span class="sn">${E.SEASONS[l.s]}</span>${esc(l.text)}</li>`).join('')}</ul></div>`).join('') || '<p class="note">記すことはまだない。</p>'}</div>
    ${years.length >= 60 ? '<p class="note">古い年は省いている。</p>' : ''}`;
}

function backBtn() {
  const prev = UI.stack.length ? UI.stack[UI.stack.length - 1] : null;
  let label = TABS.find(([k]) => k === UI.tab)[1];
  if (prev) {
    if (prev.k === 'town') label = E.townName(S, prev.id);
    else if (prev.k === 'village') label = E.vName(prev.id);
    else if (prev.k === 'store') { const st = S.stores.find((x) => x.id === prev.id); label = st ? storeName(st) : '店'; }
    else if (prev.k === 'person') { const q = P(prev.id); label = q ? q.name : '人'; }
  }
  return `<button class="btn sm ghost back" data-act="back" title="Esc でも戻る">← ${esc(label)}へ戻る</button>`;
}

  if (d.chg === 'trainAsk') { S.noTrainAsk = !el.checked; afterAction({ ok: true }, el.checked ? '稽古の知らせを出す' : '稽古の知らせを出さない'); return; }
  if (d.chg === 'autoAsk') { S.noAutoAsk = !el.checked; afterAction({ ok: true }, el.checked ? '割り振りの知らせを出す' : '割り振りの知らせを出さない'); return; }
  if (d.chg === 'autoMgr') { S.autoMgr = el.checked; if (S.autoMgr) E.autoAssign(S); afterAction({ ok: true }, S.autoMgr ? '空いた店へ自動で差配を就ける' : '自動の差配をやめた'); return; }
  if (d.chg === 'storeMgr') { afterAction(E.setStoreMgr(S, +d.sid, el.value === '' ? null : +el.value)); return; }
  if (d.chg === 'villageMgr') { afterAction(E.setVillageMgr(S, d.vid, el.value === '' ? null : +el.value)); return; }
  if (d.chg === 'addStore' && el.value) { const res = E.setStoreMgr(S, +el.value, +d.pid); afterAction(res, res.ok ? '店を受け持たせた' : null); return; }
  if (d.chg === 'addVillage' && el.value) { const res = E.setVillageMgr(S, el.value, +d.pid); afterAction(res, res.ok ? '村の差配を任せた' : null); return; }
  if (d.chg === 'rider') { const res = E.setRider(S, +d.vid, el.value === '' ? null : +el.value); afterAction(res, res.ok ? (el.value ? '乗る者を決めた' : '駕籠から降ろした') : null); return; }
  if (d.chg === 'goVillage' && el.value) { goTo('village', el.value, el); return; }
  if (d.chg === 'villaLoc') { UI.villaLoc = el.value; renderPanel(); return; }
  if (d.chg === 'postPerson' && el.value) { const res = E.setPost(S, +d.pid, +el.value); afterAction(res, res.ok ? `${E.RANK[res.rank].n}として奉公させた` : null); return; }
  if (d.chg === 'postTo' && el.value) { const res = E.setPost(S, +el.value, +d.sid); afterAction(res, res.ok ? `${E.RANK[res.rank].n}として置いた` : null); }
});

/* ---------- 開始 ---------- */
function keepStartInputs() {
  const a = $('#heroName'), b = $('#yagoName');
  if (a) UI.startName = a.value;
  if (b) UI.startYago = b.value;
}
function firstEmptySlot() { for (let i = 1; i <= SLOT_N; i++) if (!slotMeta(i)) return i; return 0; }
function showStart() {
  const st = $('#start');
  if (!UI.newSlot) UI.newSlot = firstEmptySlot() || 1;
  const occupied = !!slotMeta(UI.newSlot);
  const armed = UI.confirm === 'over' + UI.newSlot;
  st.innerHTML = `<div class="start-in">
    <h1 class="title-v" aria-label="口丹庄屋豪商傳">${[...'口丹庄屋豪商傳'].map((c) => `<span aria-hidden="true">${c}</span>`).join('')}</h1>
    <div class="start-copy">
      <p class="lead">明和四年(1767)春、丹波国桑田郡平屋村安掛。庄屋の世継ぎに生まれた十六歳が、村の米と山の炭を元手に商いを広げてゆく。木綿・呉服から茶・薬・質・廻船・両替まで二十二の商い、京・大坂・江戸から若狭・丹後の湊まで。天明と天保の飢饉、幕末の動乱、御一新を越えて、明治十年(1877)に百二十六歳で大往生するまでの百十年。</p>
      <form id="startForm">
        <label for="heroName">主人公の名<input id="heroName" maxlength="8" value="${esc(UI.startName != null ? UI.startName : '治兵衛')}" autocomplete="off"></label>
        <label for="yagoName">屋号<input id="yagoName" maxlength="8" value="${esc(UI.startYago != null ? UI.startYago : '平屋')}" autocomplete="off"></label>
        <div class="acts">
          <button class="btn big ${armed ? 'armed' : ''}" type="submit">${occupied ? (armed ? `本当に帳面 ${SLOT_NAMES[UI.newSlot]}を上書きして生まれる` : `帳面 ${SLOT_NAMES[UI.newSlot]}に上書きして生まれる`) : `この家に生まれる(帳面 ${SLOT_NAMES[UI.newSlot]})`}</button>
        </div>
      </form>
      <div class="slotwrap"><div class="slottitle">帳面 <small>四冊まで書き留められる</small></div>${slotCards('start')}</div>
      <details><summary>遊び方</summary><ul>
        <li>一手は一季(春・夏・秋・冬)。「次の季へ」で進む。「一年」「五年」はまとめて進め、判断の要る出来事が起これば止まる。キーボードなら N で一季、Y で一年。</li>
        <li>帳面は四冊まで。遊んでいる帳面には季ごとに自動で書き留める。遊んでいる途中で「帳面」を開けば、いまの家をほかの帳面へ写したり、別の帳面に切り替えたりできる。</li>
        <li>商圏図で町を選んで店を出し、家族か番頭を差配に就ける。一人が受け持てる店は商才の段の数まで(三〜十。隣り合う土地の同じ商いは一つ、副業は数えない)で、受け持ちの店どうしは同じ土地か隣り合う土地に限る。村の差配は一人三か村まで。</li>
        <li>同じ町に何種の店を並べてもよい(併営)。隣り合う土地に同じ商いを出せば本店・分店となり、いくつ出しても暖簾は一つと数える。店は小店から大問屋まで五段(名だたる土地の名だたる商いは天下の大問屋まで八段)に広げられ、大きな店ほど差配に高い商才が要る。</li>
        <li>屋敷の頁で、本邸・別邸の屋敷・蔵・庭を二十段まで普請できる。駕籠を誂えれば、乗る者はその日のうちに行き来できる土地(平屋から宇多野まで駕籠で六時間、徒歩で九時間)の店を掛け持ちで受け持てる。町や村の頁に、平屋からの時間と使える舟を示す。</li>
        <li>商才・人望・素質は十段で表す。年を重ねるだけでも少しずつ、働けばもっと伸びる。家の子は六歳から丁稚(伸び二倍)、数え十四から手代(五割増し)として店に奉公させられ、丁稚は年とともに手代に上がる。村の差配は十六歳から。</li>
        <li>人は働くほど腕が上がる。大きな店をいくつも受け持てば商才が、村の差配や当主の務めで人望が伸びる。算盤・心学・茶の湯の稽古や、京の大店への修業奉公でも伸ばせる。</li>
        <li>村方図で村を選び、田地を買い、金を貸して質流れを待ち、開墾・灌漑・干拓で田を拓き、差配を置いて影響力を60まで上げると、その村の庄屋役を引き受ける。庄屋の村の産物は、同じ品を扱う店の儲けを押し上げる。</li>
        <li>縁談で嫁や婿を迎えると働き手が増え、子が生まれる。子は十五で働きはじめる。嫁がせれば、相手の町や村との縁が深まる。</li>
        <li>家格が上がるほど、出せる暖簾の数・番頭の数・屋敷の広さが増え、江戸出店・廻船・両替や大店以上が許される。</li>
      </ul></details>
    </div></div>`;
  st.hidden = false;
  st.querySelector('#startForm').addEventListener('submit', (e) => {
    e.preventDefault();
    keepStartInputs();
    const i = UI.newSlot;
    if (slotMeta(i) && UI.confirm !== 'over' + i) { UI.confirm = 'over' + i; showStart(); return; }
    UI.confirm = null;
    const name = (UI.startName || '治兵衛').trim().slice(0, 8) || '治兵衛';
    const yago = (UI.startYago || '平屋').trim().slice(0, 8) || '平屋';
    S = E.newGame({ name, yago });
    SLOT = i;
    st.hidden = true; st.innerHTML = '';
    UI.sel = null; UI.stack = []; UI.tab = 'chou'; UI.map = 'mura'; UI.muraView = 'kinkyo'; UI.newSlot = 0;
    save(); renderAll();
    window.scrollTo(0, 0);
  });
}

function start(data) {
  migrateOldSave();
  if (data && data.S) { S = E.migrate(data.S); SLOT = data.slot || readMeta().active || 1; Object.assign(UI, data.UI || {}); if (!MURA_VIEWS.some(([k]) => k === UI.muraView)) UI.muraView = 'kinkyo'; UI.stack = UI.stack || []; $('#start').hidden = true; renderAll(); return; }
  showStart();
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => (S ? { S, slot: SLOT, UI: { tab: UI.tab, sel: UI.sel, map: UI.map, muraView: UI.muraView } } : {}));
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();

</script>
