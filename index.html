 const w=wk(o);if(w&&!S.war[w]&&!(w=='su'&&S.ev.suc))decl(w);
 tWarK(o);if(o=='fr'&&P=='jp')rel('us',-25);if(S.rel[o]!=null&&o!='us'&&o!='su')S.rel[o]=-100;
 const sea=d[6],l=D*.1*(1-S.ika/400)*(S.medi>0?.85:1.1);
 if(Math.random()<p){r.o=P;r.c=(d[8].includes('e')?35:15)+(S.L[r.id]||0)*.4;if(S.E[o]!=null)S.E[o]=Math.max(5,S.E[o]-d[5]*.25);S.army-=l*(sea?.5:1);if(sea)S.navy-=l*.4;up('stab',2);if(o=='cn')rel('us',-4);delete S.bk[r.id];lg(d[1]+'作戰成功、占領す（我'+P0+' 對 敵'+D0+'・損耗 陸'+Math.round(l*(sea?.5:1))+(sea?' 海'+Math.round(l*.4):'')+'）')}
 else{S.army-=l*2*(sea?.5:1);if(sea)S.navy-=l*.8;up('stab',-2);lg(d[1]+'作戰失敗（我'+P0+' 對 敵'+D0+'・損耗 陸'+Math.round(l*2*(sea?.5:1))+(sea?' 海'+Math.round(l*.8):'')+'）')}
 S.army=Math.max(0,S.army);S.navy=Math.max(0,S.navy);S.ap--;fin()}

 return`<div class="row"><div><span class="nm">${n}</span><span class="o" style="color:${w?'var(--sh)':'var(--mu)'}">${of?'降伏申入れ':w?'交戰中':gone?'平定':'平時'}</span><div class="meta">敵戰力 ${Math.round(e)}（降伏勧告 ${Math.round(srT(x))}未滿）${AIDR.includes(x)&&S.war[x]?(aidOn(x)?' ・米英援助 +'+S.aidR[x].toFixed(1)+'/季':' ・援助なし'):''}${x=='us'&&P=='jp'?' ・英 '+Math.round(E.gb):''}</div></div><div class="bt">${b}</div></div>`}).join('')}
