function riceHist(){if(!S.rph){S.rph=[];const yf={};for(let y=S.year-5;y<=S.year;y++)yf[y]=y===S.year?(riceF(),S.rpY):+(0.85+Math.random()*0.35).toFixed(3);for(let y=S.year-5;y<=S.year;y++)for(let m=0;m<12;m++){if(y===S.year&&m>S.month)break;S.rph.push([y,m,+(RMON[m]*yf[y]).toFixed(3)]);}}const L=S.rph[S.rph.length-1];if(!L||L[0]!==S.year||L[1]!==S.month)S.rph.push([S.year,S.month,+riceF().toFixed(3)]);if(S.rph.length>61)S.rph.splice(0,S.rph.length-61);return S.rph;}
function riceChart(){const H=riceHist(),n=H.length,W=600,Ht=160,pl=50,pr=10,pt=10,pb=22,B=H.map(x=>x[2]*12000),Sl=H.map(x=>x[2]*8000),mn=Math.min(...Sl)*0.94,mx=Math.max(...B)*1.04,X=i=>pl+(W-pl-pr)*i/Math.max(1,n-1),Y=v=>pt+(Ht-pt-pb)*(1-(v-mn)/(mx-mn));
 const pts=a=>a.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' '),lab=v=>v>=10000?(Math.round(v/1000)/10)+'万':Math.round(v/100)*100+'';
 let g='';for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#4a3d2a" stroke-width=".6"/><text x="${pl-5}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="#c9b98f">${lab(v)}</text>`;}
 H.forEach((x,i)=>{if(x[1]===0)g+=`<line x1="${X(i)}" x2="${X(i)}" y1="${pt}" y2="${Ht-pb}" stroke="#4a3d2a" stroke-width=".6"/><text x="${X(i)}" y="${Ht-6}" text-anchor="middle" font-size="10" fill="#c9b98f">${x[0]}</text>`;});
 return`<svg viewBox="0 0 ${W} ${Ht}" style="width:100%;max-width:640px;background:#1c160f;border:1px solid #4a3d2a;border-radius:6px">${g}<polyline fill="none" stroke="#e07a5f" stroke-width="2" points="${pts(B)}"/><polyline fill="none" stroke="#6fb3c9" stroke-width="2" stroke-dasharray="5 3" points="${pts(Sl)}"/><circle cx="${X(n-1)}" cy="${Y(B[n-1])}" r="3.5" fill="#e07a5f"/><circle cx="${X(n-1)}" cy="${Y(Sl[n-1])}" r="3.5" fill="#6fb3c9"/></svg>`;}
